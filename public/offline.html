<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <title>You're offline | Bolo Kobul</title>
  <style>
    :root { --bg: #FDFAF3; --ink: #222233; --muted: #6E6E78; --gold: #C99A16; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    .card { max-width: 360px; width: 100%; }
    img { width: 96px; height: 96px; border-radius: 24px; display: block; margin: 0 auto 28px; }
    h1 { font-size: 22px; line-height: 1.3; margin: 0 0 12px; font-weight: 700; }
    p { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0 0 28px; }
    button {
      appearance: none; border: 0; border-radius: 999px; padding: 14px 32px;
      background: var(--gold); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="Bolo Kobul">
    <h1>You're offline</h1>
    <p>Please check your internet connection. Bolo Kobul will reload as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
