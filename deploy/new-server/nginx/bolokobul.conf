# Same as the current server's nginx site, plus security headers.
server {
    listen 80;
    listen [::]:80;
    server_name bolokobul.com www.bolokobul.com;
    return 301 https://$host$request_uri;
}

upstream bolokobul_app {
    server unix:/home/ubuntu/apps/bolokobul/shared/tmp/sockets/bolokobul-puma.sock fail_timeout=0;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bolokobul.com www.bolokobul.com;
    root /home/ubuntu/apps/bolokobul/current/public;

    ssl_certificate     /etc/letsencrypt/live/bolokobul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bolokobul.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(assets|packs|vendor|images|icons|favicon.ico|robots.txt) {
        gzip_static on;
        expires max;
        add_header Cache-Control public;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /cable {
        proxy_pass http://bolokobul_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://bolokobul_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    error_page 500 502 503 504 /500.html;
    client_max_body_size 20M;
    access_log /var/log/nginx/bolokobul_access.log;
    error_log  /var/log/nginx/bolokobul_error.log;
}
