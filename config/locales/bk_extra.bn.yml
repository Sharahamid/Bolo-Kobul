      plus_text: "আরও দ্রুত এগোতে চান? BK+ দেয় সোনালি ব্যাজ, সমান মানের ম্যাচের মধ্যে আপনার প্রোফাইল আগে দেখানো, কে আপনার প্রোফাইল দেখেছে ও কে সেভ করেছে তা জানার সুযোগ, আর বোনাস বাটারফ্লাই।"
