    how:
      title: "বলো কবুল যেভাবে কাজ করে"
      subtitle: "বিনামূল্যে প্রোফাইল থেকে পরিবারের সঙ্গে দেখা — আটটি সহজ ধাপে।"
      step: "ধাপ %{n}"
      steps:
        s1_title: "প্রোফাইল তৈরি করুন — বিনামূল্যে"
        s1_text: "ফোন, গুগল বা ফেসবুক দিয়ে নিবন্ধন করুন। আপনার ফোন নম্বর ওয়ান-টাইম কোডে যাচাই হয় এবং অন্য সদস্যদের কখনো দেখানো হয় না।"
        s2_title: "পছন্দের সঙ্গীর তথ্য দিন"
        s2_text: "বয়স, উচ্চতা, ধর্ম, শিক্ষা ইত্যাদি বেছে নিন। তারপর প্রতিটি প্রোফাইলে দেখাবে আপনার সঙ্গে কত শতাংশ মিল।"
        s3_title: "খুঁজুন ও ফেভারিটে রাখুন"
        s3_text: "ম্যাচ দেখুন ও ফিল্টার ব্যবহার করুন। পছন্দের প্রোফাইল ফেভারিটে রাখুন, যখন খুশি আবার দেখুন।"
        s4_title: "১ম কবুল পাঠান"
        s4_text: "কাউকে পছন্দ হলে ১ম কবুল পাঠান। এতে %{n1}টি বাটারফ্লাই লাগে, উত্তর না দেওয়া পর্যন্ত আটকে থাকে — প্রত্যাখ্যান বা বাতিল হলে ফেরত পাবেন।"
        s5_title: "১ম কবুল গৃহীত — প্রোফাইল খুলে যায়"
        s5_text: "গ্রহণ করতে তাঁরও %{n1}টি বাটারফ্লাই লাগে। তিনি গ্রহণ করলে দুজনেই একে অপরের ছবি, শিক্ষা, পেশা, পরিবার ও নিজের সম্পর্কে দেখতে পাবেন।"
        s6_title: "চ্যাটের জন্য ২য় কবুল পাঠান"
        s6_text: "কথা বলতে চান? ২য় কবুল পাঠান (%{n2}টি বাটারফ্লাই)। তিনি গ্রহণ করলে (তাঁরও %{n2}টি বাটারফ্লাই লাগে) চ্যাট খুলবে। প্রত্যাখ্যান হলে এই বাটারফ্লাই ফেরত হয় না।"
        s7_title: "বলো কবুলে নিরাপদে চ্যাট করুন"
        s7_text: "চ্যাটে একে অপরকে জানুন। ফোন নম্বর লুকানো থাকে — স্বস্তি বোধ করলে তবেই শেয়ার করুন।"
        s8_title: "পরিবারের সঙ্গে দেখা করুন"
        s8_text: "সময় হলে পরিবারকে যুক্ত করুন এবং একসঙ্গে পরের ধাপে এগিয়ে যান। আপনাদের সাফল্যের গল্প শুনতে চাই!"
      cta_title: "শুরু করতে প্রস্তুত?"
      cta_text: "প্রোফাইল তৈরি বিনামূল্যে, লাগে মাত্র কয়েক মিনিট।"
