# Known advisories checked and found not to put the site at risk.
# The weekly security scan (.github/workflows/security.yml) skips these and fails only
# on anything new. Remove an entry once it no longer applies.
#
# devise, puma: upgraded to fixed versions (October 2026), nothing to ignore.
#
# ckeditor 5.1.3 / CKEditor 4.22.1 (the last open-source CKEditor 4): the page-content
# editor, used only inside the admin panel by signed-in admins. These have no free fix,
# and each depends on something the site does not use:
ignore:
  - CVE-2023-4771   # AJAX sample page: samples are not hosted (editor loads from CKEditor's CDN)
  - CVE-2024-24816  # samples with the preview feature: same, no samples hosted
  - CVE-2024-43407  # Code Snippet GeSHi plugin: not enabled
  - CVE-2024-43411  # version-check notification: turned off (versionCheck = false in ckeditor/config.js)
  - CVE-2024-24815  # crafted CDATA content: only admins can type into the editor
