# Bangla text for the Privacy Policy page.
- model: PrivacyPolicy
  id: 1
  fields:
    title_bn: এই ওয়েবসাইট ব্যবহার করতে আপনাকে কী কী তথ্য দিতে হবে?
    content_bn: |
      <p style="text-align: justify;">আপনি আমাদের ওয়েবসাইট ব্যবহার করলে আমরা কিছু তথ্য পাই ও সংগ্রহ করি। কী তথ্য পাব ও সংগ্রহ করব তা নির্ভর করে ওয়েবসাইটে আপনি কী করছেন তার ওপর, তবে এর মধ্যে থাকতে পারে ইমেইল ঠিকানা, নাম, জন্মতারিখ, শিক্ষাগত যোগ্যতা, আপনার দেওয়া পাসওয়ার্ড, ডাক ঠিকানা, মোবাইল নম্বর বা পেশাগত তথ্য।</p>
      <p style="text-align: justify;"><em>স্বয়ংক্রিয়ভাবে সংগৃহীত তথ্য</em></p>
      <p style="text-align: justify;">আপনি ওয়েবসাইটে এলে কিছু তথ্য স্বয়ংক্রিয়ভাবে আমাদের কাছে আসে এবং কখনো কখনো সংগ্রহ করা হয়। আপনি যে ডোমেইন ও হোস্ট থেকে ইন্টারনেট ব্যবহার করছেন তার নাম; আপনার ব্যবহৃত কম্পিউটারের আইপি (IP) ঠিকানা; আপনার ব্রাউজার সফটওয়্যার ও অপারেটিং সিস্টেম; আমাদের সাইটে আসার তারিখ ও সময়; এবং যে ওয়েবসাইট থেকে সরাসরি আমাদের সাইটে এসেছেন তার ঠিকানা আমরা পাই ও সংগ্রহ করি। সাইটের ব্যবহার পর্যবেক্ষণে আমরা এই তথ্য ব্যবহার করি। এছাড়া আপনাকে ইমেইল পাঠালে আপনার ইমেইল ঠিকানা সম্পর্কে কিছু তথ্য জানতে পারি, যেমন আপনি ছবিসমৃদ্ধ HTML ইমেইল পড়তে পারেন কি না। স্বয়ংক্রিয়ভাবে সংগৃহীত সব তথ্য আমাদের ওয়েবসাইটকে আরও সহজে ব্যবহারযোগ্য করতে এবং ব্যবহারকারী ও ব্যবহারের ধরন সম্পর্কে সামগ্রিক ধারণা পেতে সাহায্য করে।</p>
      <p style="text-align: justify;"><em>কুকির মাধ্যমে সংগৃহীত তথ্য</em></p>
      <p style="text-align: justify;">আমাদের ওয়েবসাইট ব্যবহারের অভিজ্ঞতা উন্নত করতে আমরা কুকি ব্যবহার করি। কুকি হলো আপনার হার্ড ড্রাইভে রাখা ছোট ফাইল, যা আমাদের সেবা দিতে সাহায্য করে। কুকি এই তথ্য আমাদের ওয়েবসাইটের কম্পিউটারে অথবা ব্যানার ও নিউজলেটারের তৃতীয় পক্ষের পরিবেশকদের কাছে পাঠায়; সাধারণভাবে শুধু এই কম্পিউটারগুলোই এই তথ্য পড়ার অনুমতিপ্রাপ্ত। তৃতীয় পক্ষের কুকি ব্যবহার আমরা নিয়ন্ত্রণ করি না।</p>
      <p style="text-align: justify;">সংগৃহীত তথ্যের মাধ্যমে আমরা যা করতে পারি</p>
      <ol>
        <li><p style="text-align: justify;">দ্রুত পাতা ঘোরা;</p></li>
        <li><p style="text-align: justify;">আপনাকে উপযুক্ত ম্যাচের সুপারিশ দেওয়া;</p></li>
        <li><p style="text-align: justify;">আপনার দেওয়া তথ্য মনে রাখা, যাতে প্রতিবার ওয়েবসাইটে এসে আবার দিতে না হয়;</p></li>
        <li><p style="text-align: justify;">আমাদের কিছু মার্কেটিং ইমেইল প্রচারণার কার্যকারিতা পর্যবেক্ষণ;</p></li>
        <li><p style="text-align: justify;">মোট দর্শক, দেখা পাতা ও দেখানো ব্যানারের সংখ্যা পর্যবেক্ষণ।</p></li>
      </ol>
      <p style="text-align: justify;">ব্যবহারকারীদের ক্রেডিট কার্ডের তথ্য সুরক্ষিত রাখতে ডেবিট/ক্রেডিট কার্ড লেনদেনের জন্য আমরা নিরাপদ সার্ভার ব্যবহার করি, এবং লগইনের তথ্য রাখতে কুকি ব্যবহার করা হয়। আমাদের সেবার পেমেন্টের জন্য ক্রেডিট অ্যাকাউন্ট খুললে বিলিং ঠিকানা, ক্রেডিট/ডেবিট কার্ড নম্বর ও কার্ডের মেয়াদসহ কিছু অতিরিক্ত তথ্য সংগ্রহ করা হয়।</p>
      <p style="text-align: justify;">বেশিরভাগ মানুষ জানেন না যে আমাদের বা অধিকাংশ ওয়েবসাইটে গেলে তাদের কম্পিউটারে কুকি রাখা হয়, কারণ ব্রাউজার সাধারণত কুকি গ্রহণ করার জন্যই সেট করা থাকে। চাইলে প্রতিবার কুকি পাঠানোর সময় ব্রাউজার যেন আপনাকে সতর্ক করে সে ব্যবস্থা করতে পারেন, অথবা কুকি পুরোপুরি বন্ধ করতে পারেন। কুকি প্রত্যাখ্যান করলে আমাদের ওয়েবসাইট ঠিকমতো ব্যবহার করতে পারবেন না, এবং আপনার সামগ্রিক ইন্টারনেট ব্যবহারের অভিজ্ঞতাও প্রভাবিত হবে।</p>
      <p style="text-align: justify;"><em>ওয়েবসাইটে আপনি নিজে যে তথ্য দেন</em></p>
      <p style="text-align: justify;">আমাদের ওয়েবসাইট নিবন্ধিত ব্যবহারকারীদের জন্য তৈরি। ওয়েবসাইট কীভাবে কাজ করে তা বোঝানোর কয়েকটি পাতা ছাড়া বেশিরভাগ পাতা দেখতে নিবন্ধিত অ্যাকাউন্টে লগইন থাকতে হয়। অ্যাকাউন্ট খুলতে একটি পাসওয়ার্ড বেছে নিতে হবে। এ সময় আপনাকে নিচের সব ব্যক্তিগত তথ্য দিতে হবে: আপনার নাম, ইমেইল ঠিকানা ও ফোন নম্বর। আপনার কাছ থেকে টাকা নেওয়ার কাজে লাগতে পারে এমন কোনো তথ্য (যেমন ক্রেডিট কার্ড, ব্যাংক অ্যাকাউন্ট ইত্যাদি) আমরা সংগ্রহ করি না। কারও জন্য (নিজেসহ) প্রোফাইল তৈরি করলে সেই প্রোফাইলের জন্য মিল খুঁজতে প্রয়োজনীয় অতিরিক্ত ব্যক্তিগত তথ্য দিতে হবে।</p>
      <p style="text-align: justify;">আমরা কী তথ্য সংগ্রহ করি তা নির্ভর করে আমাদের ও ওয়েবসাইটের সঙ্গে আপনার যোগাযোগের প্রেক্ষাপট, আপনার সিদ্ধান্ত এবং আপনার ব্যবহৃত পণ্য ও সুবিধার ওপর। ব্যবহারকারীর তথ্য পরিচয় যাচাই ও অ্যাকাউন্টে প্রবেশের জন্য ব্যবহৃত হয়। ব্যবহারকারী ওয়েবসাইটে এলে ডিভাইস আইডি, লগ ফাইল, ভৌগোলিক অবস্থান ও ডিভাইসের তথ্য/বৈশিষ্ট্যও স্বয়ংক্রিয়ভাবে সংগ্রহ করা হয়।</p>
      <p style="text-align: justify;">তথ্য বিশ্লেষণ, ব্যবহারের প্রবণতা বোঝা, ওয়েবসাইটের মূল্যায়ন ও উন্নয়ন, বাজার গবেষণা এবং প্রতারণা প্রতিরোধে আমরা আপনার ব্যক্তিগত তথ্য ব্যবহার করতে পারি। আমাদের পণ্য ও সেবা ক্রমাগত উন্নত করার প্রচেষ্টায় আমরা ওয়েবসাইটে ব্যবহারকারীদের কার্যকলাপের জনমিতিক ও প্রোফাইল তথ্য সংগ্রহ ও বিশ্লেষণ করি। সার্ভারের সমস্যা নির্ণয় ও ওয়েবসাইট পরিচালনায় আমরা আপনার আইপি ঠিকানা শনাক্ত ও ব্যবহার করি। আপনাকে শনাক্ত করতে এবং বিস্তৃত জনমিতিক তথ্য সংগ্রহেও আপনার আইপি ঠিকানা ব্যবহৃত হয়।</p>
      <p style="text-align: justify;">বিকাশ, নগদ ও SSL-সহ আমাদের পেমেন্ট সহযোগীদের সঙ্গে নিরাপদ পেমেন্ট সেশন বজায় রাখতেও আমরা সেশন কুকি ব্যবহার করি। এই সেশনগুলো সাময়িক এবং লেনদেন শেষ হলেই মেয়াদ শেষ হয়ে যায়।</p>

- model: PrivacyPolicy
  id: 2
  fields:
    title_bn: ওয়েবসাইট সংগৃহীত তথ্য কীভাবে ব্যবহার করে?
    content_bn: |
      <p>BoloKobul.com তথ্য বিশ্লেষণ, ব্যবহারের প্রবণতা শনাক্ত, প্রচারণার কার্যকারিতা নির্ধারণ, ওয়েবসাইট, পণ্য ও সেবার মূল্যায়ন ও উন্নয়ন এবং বাজার গবেষণার জন্য ব্যবহারকারীদের কাছ থেকে তথ্য সংগ্রহ করে — মূলত আপনার প্রয়োজন পূরণ এবং আপনার জন্য ব্যক্তিগতকৃত অভিজ্ঞতা নিশ্চিত করতে।</p>
      <p style="text-align: justify;">ব্যক্তিগত তথ্য বলতে বোঝায় শনাক্তকৃত বা শনাক্তযোগ্য কোনো ব্যক্তি সম্পর্কিত যেকোনো তথ্য। প্রযোজ্য আইন সাপেক্ষে যেকোনো সময় আপনার ব্যক্তিগত তথ্য শেয়ার ও দেখার, তথ্য শেয়ারের সম্মতি প্রত্যাহারের এবং তথ্য মুছে ফেলার অধিকার আপনার আছে। আমাদের সঙ্গে যোগাযোগ করে দেওয়া সম্মতি প্রত্যাহার করতে পারেন। আপনার ব্যক্তিগত তথ্য ডেটাবেসে সংরক্ষিত থাকতে পারে। এই অধিকারগুলো কার্যকর করার আগে আমরা প্রমাণ চাইতে বা আপনার পরিচয় যাচাই করতে পারি। আপনার ব্যক্তিগত তথ্য দেখা, হালনাগাদ বা মুছে ফেলার অনুরোধ জানাতে support@bolokobul.com ঠিকানায় ইমেইল করুন।</p>

- model: PrivacyPolicy
  id: 3
  fields:
    title_bn: ওয়েবসাইট সংগৃহীত তথ্য কাদের সঙ্গে শেয়ার করে?
    content_bn: |
      <p>আমরা এই শনাক্তযোগ্য তথ্য আমাদের সহযোগী, অংশীদার ও অধীন প্রতিষ্ঠানগুলোর সঙ্গে শেয়ার করতে পারি, এবং এর ফলে তারা আপনার কাছে বিপণন করতে পারে। আপনার দেওয়া যেকোনো তথ্য সর্বোচ্চ যত্ন ও নিরাপত্তার সঙ্গে রাখা হয়। আইন বা আইনি প্রক্রিয়া অনুযায়ী কোনো গ্রাহকের তথ্য দেওয়ার প্রয়োজন হলে আমরা পূর্ণ সহযোগিতা করতে বাধ্য।</p>
      <p style="text-align: justify;">আইনে প্রয়োজন বা অনুমোদিত হলে নিয়ন্ত্রক সংস্থা ও আইনশৃঙ্খলা রক্ষাকারী বাহিনীর মতো অন্যদের তথ্য দেওয়া হতে পারে, অথবা বলো কবুল, অন্য ব্যবহারকারী বা জনসাধারণের অধিকার, সম্পত্তি বা ব্যক্তিগত নিরাপত্তা রক্ষায় তথ্য দেওয়া হতে পারে।</p>
      <p style="text-align: justify;">ঘটকালি কার্যক্রমে যুক্ত বাইরের ঘটকদের সঙ্গে আমরা আপনার প্রাথমিক তথ্য শেয়ার করি। ঘটকরা স্বাধীন ব্যবসার মালিক। ঘটকালির প্রক্রিয়ায় সম্পর্কহীন কোনো ঘটকও আপনার ব্যক্তিগত তথ্য পেতে পারেন। তবে সম্পর্কহীন ঘটকের কাছে আপনার কতটুকু তথ্য প্রকাশ হবে, তা আপনার অনুরোধ অনুযায়ী নিয়ন্ত্রিত হবে।</p>
      <p style="text-align: justify;">সময়ে সময়ে আমরা একীভূতকরণ, অধিগ্রহণ, পুনর্গঠন, সম্পদ বিক্রি বা এ ধরনের কোনো প্রাতিষ্ঠানিক লেনদেন বিবেচনা করতে পারি। এসব ক্ষেত্রে লেনদেনটির মূল্যায়ন ও সম্পাদনের জন্য আমরা তথ্য হস্তান্তর করতে বা তথ্য দেখার সুযোগ দিতে পারি। কোনো ব্যবসা বা সম্পদ কেনাবেচা করলে ব্যক্তিগত তথ্য লেনদেনে যুক্ত তৃতীয় পক্ষের কাছে হস্তান্তর হতে পারে।</p>
      <p style="text-align: justify;">আমাদের ওয়েবসাইটে অন্য ওয়েবসাইটের লিংক আছে, যেগুলো আপনার সম্পর্কে শনাক্তযোগ্য ব্যক্তিগত তথ্য সংগ্রহ করতে পারে। সেসব ওয়েবসাইটের গোপনীয়তা নীতি বা বিষয়বস্তুর জন্য আমরা দায়ী নই।</p>

- model: PrivacyPolicy
  id: 4
  fields:
    title_bn: আমরা কত দিন আপনার তথ্য রাখি?
    content_bn: |
      <p style="text-align: justify;">গোপনীয়তা নীতি অনুযায়ী নিচের ক্ষেত্রগুলোতে আমরা ব্যবহারকারীদের কাছ থেকে সংগৃহীত তথ্য সংরক্ষণ করব:</p>
      <p style="margin-left: 40px; text-align: justify;">- যত দিন ব্যবহারকারী আমাদের সেবা নিচ্ছেন, যে উদ্দেশ্যে তথ্য সংগ্রহ করা হয়েছিল তা পূরণের জন্য;</p>
      <p style="margin-left: 40px; text-align: justify;">- চুক্তি কার্যকর করার জন্য;</p>
      <p style="margin-left: 40px; text-align: justify;">- নিরীক্ষার (অডিট) জন্য;</p>
      <p style="margin-left: 40px; text-align: justify;">- যেকোনো ধরনের বিরোধ নিষ্পত্তির জন্য;</p>
      <p style="margin-left: 40px; text-align: justify;">- আইনি সুরক্ষা প্রতিষ্ঠার জন্য;</p>
      <p style="margin-left: 40px; text-align: justify;">- বৈধ ব্যবসা পরিচালনা এবং প্রযোজ্য আইন মেনে চলার জন্য।</p>
      <p style="text-align: justify;">অ্যাকাউন্ট বন্ধ বা সর্বশেষ কার্যকলাপের পর ১ বছর পর্যন্ত আমরা আপনার ব্যক্তিগত তথ্য সংরক্ষণ করি। এরপর বাংলাদেশের আইনে আরও বেশি সময় রাখার প্রয়োজন না হলে আপনার তথ্য আমাদের সার্ভার থেকে স্থায়ীভাবে মুছে ফেলা হয়।</p>
      <p style="text-align: justify;">যেকোনো সময় <a href="mailto:support@bolokobul.com">support@bolokobul.com</a> ঠিকানায় যোগাযোগ করে আপনার অ্যাকাউন্ট ও সংশ্লিষ্ট সব তথ্য সম্পূর্ণ মুছে ফেলার অনুরোধ করতে পারেন। আমরা ৩০ দিনের মধ্যে আপনার অনুরোধ কার্যকর করব।</p>

- model: PrivacyPolicy
  id: 5
  fields:
    title_bn: আপনার ব্যক্তিগত তথ্যের নিরাপত্তায় কী সতর্কতা নেওয়া হয়?
    content_bn: |
      <p>প্রাতিষ্ঠানিক ও কারিগরি নিরাপত্তা ব্যবস্থার মাধ্যমে আমরা আপনার ব্যক্তিগত তথ্য সুরক্ষিত রাখার চেষ্টা করি। আমাদের প্রক্রিয়াকৃত যেকোনো ব্যক্তিগত তথ্যের নিরাপত্তায় যথাযথ অভ্যন্তরীণ নিয়ন্ত্রণ ব্যবস্থা চালু রয়েছে। তবে মনে রাখবেন, ইন্টারনেট নিজে ১০০% নিরাপদ, এমন নিশ্চয়তা আমরা দিতে পারি না। আপনার তথ্য আমাদের কাছে আসার পর অননুমোদিত প্রবেশ থেকে তা রক্ষায় আমরা নিরাপত্তা নির্দেশিকা মেনে চলি।</p>

- model: PrivacyPolicy
  id: 6
  fields:
    title_bn: BoloKobul.com থেকে যোগাযোগ
    content_bn: |
      <p>গ্রাহক হিসেবে আপনি BoloKobul.com থেকে লেনদেন ও অ্যাকাউন্ট রক্ষণাবেক্ষণ-সংক্রান্ত নিচের যোগাযোগগুলো পেতে পারেন। এর মধ্যে রয়েছে, তবে এগুলোতেই সীমাবদ্ধ নয়: ম্যাচ-সংক্রান্ত নোটিশ, ওয়েবসাইটের নীতি ও অ্যাকাউন্ট ব্যবস্থাপনা পদ্ধতিতে গুরুত্বপূর্ণ পরিবর্তনের নোটিশ।</p>
      <p style="text-align: justify;">BoloKobul.com ও তার অংশীদারদের পণ্য ও সেবা সম্পর্কিত তথ্যসহ যোগাযোগ। BoloKobul.com, তার অধীন প্রতিষ্ঠান এবং বিশ্বস্ত তৃতীয় পক্ষের পণ্য ও সেবা সম্পর্কে আমরা গ্রাহকদের প্রচারমূলক ইমেইল ও অন্যান্য বার্তা পাঠাই।</p>

- model: PrivacyPolicy
  id: 7
  fields:
    title_bn: তৃতীয় পক্ষের ওয়েবসাইটের লিংক
    content_bn: |
      <p>আমাদের ওয়েবসাইটের লিংক ও ব্যানারে চেপে তৃতীয় পক্ষের ওয়েবসাইটে গেলে সেই তৃতীয় পক্ষের গোপনীয়তা নীতি প্রযোজ্য হবে। ইন্টারনেটে গোপনীয়তা রক্ষাকে আমরা সমর্থন করলেও কোনো তৃতীয় পক্ষের ওয়েবসাইটের কার্যকলাপের দায় আমরা নিতে পারি না। আমাদের ওয়েবসাইট থেকে যান বা নিজে থেকে, যে ওয়েবসাইটেই যান তার প্রকাশিত গোপনীয়তা বিবৃতি পড়ে নেওয়ার পরামর্শ দিই।</p>
      <p>আমাদের তৃতীয় পক্ষের অংশীদারদের মধ্যে রয়েছে AamarPay (পেমেন্ট প্রক্রিয়াকরণ), বিকাশ, নগদ ও ফেসবুক। প্রত্যেক অংশীদার নিজস্ব গোপনীয়তা নীতি অনুযায়ী পরিচালিত হয়।</p>

- model: PrivacyPolicy
  id: 8
  fields:
    title_bn: গোপনীয়তা নীতির পরিবর্তন
    content_bn: |
      <p>BoloKobul যেকোনো সময় আমাদের সাইটে সংশোধিত গোপনীয়তা নীতি প্রকাশের মাধ্যমে এই নীতি পরিবর্তন বা সংশোধনের অধিকার রাখে।</p>

- model: PrivacyPolicy
  id: 9
  fields:
    title_bn: প্রশ্ন বা মতামত
    content_bn: |
      <p style="text-align: justify;">আপনার অভিযোগ বা জিজ্ঞাসার জন্য ইমেইল করুন: support@bolokobul.com</p>
      <p style="text-align: justify;">যোগাযোগ: ০১৬১১-৮২০৪১০</p>
      <p style="text-align: justify;">ঠিকানা: ১৪, স্যার ইকবাল রোড, খুলনা</p>
