- model: Contact
  id: 1
  fields:
    heading_bn: আমাদের সঙ্গে যুক্ত হোন!
    content_bn: |
      আপনার কি বিয়ে-সংক্রান্ত কোনো ব্যবসা আছে? এই মুহূর্তে আপনার সেবা খুঁজছেন এমন অনেক মানুষের কাছে পৌঁছাতে আমরা আপনাকে সাহায্য করতে পারি।

      বিয়ের আয়োজন, ফটোগ্রাফি, ক্যাটারিং, ফুল বা বিয়ে-সংক্রান্ত যেকোনো কাজ করলে আমাদের প্ল্যাটফর্ম আপনাকে সঠিক গ্রাহকের কাছে পৌঁছাতে এবং ব্যবসা বাড়াতে সাহায্য করবে।

      আজই যুক্ত হোন এবং স্বপ্নের বিয়ের পরিকল্পনা করছেন এমন দম্পতিদের সঙ্গে সংযোগ গড়ুন!

