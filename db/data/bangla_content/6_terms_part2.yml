# Bangla text for the Terms of Use page, sections 4 to 14.
- model: TermsOfUse
  id: 15
  fields:
    title_bn: 4.1 বিষয়বস্তুর মালিকানা স্বত্ব
    content_bn: |
      <p>আপনি স্বীকার করছেন যে BoloKobul.com-এর বিষয়বস্তু ও সেবা (যার মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়, যেকোনো যোগাযোগ, পৃষ্ঠপোষকের বিজ্ঞাপন বা বার্তায় থাকা লেখা, শব্দ, ছবি, গ্রাফিক্স বা অন্যান্য উপাদান — মালিক, বিজ্ঞাপনদাতা, সহযোগী বা অংশীদার যারই হোক) কপিরাইট, ট্রেডমার্ক, সার্ভিস মার্ক, পেটেন্ট ও/অথবা অন্যান্য মালিকানা স্বত্ব ও আইন দ্বারা সুরক্ষিত; তাই বলো কবুল, এর বিজ্ঞাপনদাতা, সহযোগী ও অংশীদারদের স্পষ্ট অনুমতি অনুযায়ীই কেবল বিষয়বস্তু ও সেবা ব্যবহার করতে পারবেন।</p>
      <p style="text-align: justify;">ছবি যোগ করলে আপনি স্বয়ংক্রিয়ভাবে সম্মত হচ্ছেন যে BoloKobul.com ওয়েবসাইটে আপনার ছবি দেখাতে পারবে, যা আপনাকে আরও বেশি সাড়া পেতে সাহায্য করবে। ওয়েবসাইটে আপনার ছবি দেখাতে না চাইলে নাম ও ইমেইল ঠিকানাসহ আপনার অনুরোধ ব্যাখ্যা করে <strong>support@bolokobul.com</strong> ঠিকানায় ইমেইল করুন।</p>

- model: TermsOfUse
  id: 16
  fields:
    title_bn: 4.2 ব্যবহারকারীর বিষয়বস্তু জমা দেওয়া
    content_bn: |
      <p>ওপরের "বিষয়বস্তুর মালিকানা স্বত্ব" অনুচ্ছেদে উল্লিখিত ক্ষেত্র ছাড়া, ওয়েবসাইটে প্রকাশের জন্য BoloKobul.com-এ শুধু নিচের বিষয়বস্তু আপলোড বা জমা দিতে পারবেন</p>
      <p style="text-align: justify; margin-left: 40px;">(i) কপিরাইট বা অন্য কোনো মালিকানা স্বত্বের বিধিনিষেধমুক্ত বিষয়বস্তু;</p>
      <p style="text-align: justify; margin-left: 40px;">(ii) যে বিষয়বস্তু ইন্টারনেটে প্রকাশের জন্য মালিক বা লাইসেন্সদাতা বলো কবুলকে স্পষ্ট অনুমতি দিয়েছেন; অথবা</p>
      <p style="text-align: justify; margin-left: 40px;">(iii) যে বিষয়বস্তুতে কোনো ভাইরাস, স্ক্রিপ্ট, ট্রোজান হর্স, ওয়ার্ম, টাইম বোমা, ক্যানসেলবট, ইস্টার এগ বা এমন কোনো কম্পিউটার প্রোগ্রাম নেই, যা কোনো সিস্টেম, তথ্য বা ব্যক্তিগত তথ্যের ক্ষতি, ক্ষতিকর হস্তক্ষেপ, গোপনে আটকানো বা আত্মসাৎ করতে পারে ("ক্ষতিকর বিষয়বস্তু")।</p>
      <p style="text-align: justify;">কপিরাইট মালিকের সম্মতিতে প্রকাশিত কপিরাইটযুক্ত বা অন্য মালিকানাধীন বিষয়বস্তুতে "কপিরাইট, মালিক [মালিকের নাম]; অনুমতিক্রমে ব্যবহৃত" ধরনের বাক্য থাকা উচিত। বলো কবুল ধরে নিতে পারে যে জমা দেওয়া সব বিষয়বস্তু ওপরের শর্তগুলো পূরণ করে। কপিরাইটযুক্ত বা অন্য মালিকানাধীন বিষয়বস্তু অননুমোদিতভাবে জমা দেওয়া বেআইনি, এবং এর জন্য দেওয়ানি মামলায় ক্ষতিপূরণের ব্যক্তিগত দায় ও ফৌজদারি বিচারের মুখোমুখি হতে পারেন। কপিরাইট বা মালিকানা স্বত্ব লঙ্ঘন, অথবা অননুমোদিত বা ক্ষতিকর বিষয়বস্তু জমা দেওয়ার ফলে হওয়া যেকোনো ক্ষতির জন্য আপনি দায়ী থাকবেন। কপিরাইট বা মালিকানা স্বত্ব লঙ্ঘন, অথবা ক্ষতিকর বিষয়বস্তুসহ যেকোনো ব্যবহারকারীর জমা দেওয়া বিষয়বস্তু থেকে হওয়া ক্ষতির কোনো দায় বলো কবুল নেবে না। ব্যবহারকারীর জমা দেওয়ার অংশে বিষয়বস্তু জমা দিয়ে আপনি স্বয়ংক্রিয়ভাবে BoloKobul.com-কে — অথবা আপনি নিশ্চয়তা দিচ্ছেন যে বিষয়বস্তুর মালিক বা অনুমোদিত লাইসেন্সদাতা স্পষ্টভাবে BoloKobul.com-কে — সেই বিষয়বস্তুর বিদ্যমান কপিরাইটের পূর্ণ মেয়াদে বর্তমানে জানা বা ভবিষ্যতে উদ্ভাবিত যেকোনো রূপ, মাধ্যম বা প্রযুক্তিতে, সারা বিশ্বে, সম্পূর্ণ বা আংশিকভাবে ব্যবহার, পুনরুৎপাদন, প্রকাশ, অনুবাদ, সাবলাইসেন্স, কপি ও বিতরণের এবং/অথবা অন্য কাজে অন্তর্ভুক্ত করার রয়্যালটিমুক্ত, স্থায়ী ও অপরিবর্তনীয় অধিকার ও লাইসেন্স দিচ্ছেন। এই অনুমতি সাপেক্ষে BoloKobul.com-এ জমা দেওয়া বিষয়বস্তুর লাইসেন্সদাতা সেই বিষয়বস্তুর ওপর বিদ্যমান সব অধিকার রাখেন। আপনি বুঝতে পারছেন ও সম্মত হচ্ছেন যে বলো কবুলের একক বিবেচনায় এই চুক্তি লঙ্ঘনকারী, আপত্তিকর, বেআইনি অথবা ব্যবহারকারীদের অধিকার লঙ্ঘন, ক্ষতি বা নিরাপত্তা হুমকির কারণ হতে পারে এমন যেকোনো বিষয়বস্তু, বার্তা, ইমেইল, ছবি বা প্রোফাইল (একত্রে "বিষয়বস্তু") বলো কবুল সম্পূর্ণ বা আংশিকভাবে পর্যালোচনা ও মুছে ফেলতে পারে।</p>

- model: TermsOfUse
  id: 17
  fields:
    title_bn: 4.3 গোপন নয় এমন তথ্য
    content_bn: |
      <p>গ্রাহক সহায়তা, অভ্যন্তরীণ কাজ, প্রতারণা প্রতিরোধ বা আপনাকে সেবা দেওয়ার জন্য আমাদের কর্মী বা সরবরাহকারীদের আপনার ব্যক্তিগত তথ্য দেখার সুযোগ দেওয়ার প্রয়োজন হতে পারে।</p>

- model: TermsOfUse
  id: 18
  fields:
    title_bn: 4.4 কপিরাইট হস্তান্তর
    content_bn: |
      <p>আপনি সম্মত হচ্ছেন যে আপনার দেওয়া যেকোনো উপাদান বা তথ্যের ওপর বিদ্যমান সব কপিরাইট এই শর্তাবলির আওতায় ব্যবহারের জন্য হস্তান্তরিত হলো। অন্য কোনো ব্যক্তি বা প্রতিষ্ঠানের কপিরাইটযুক্ত কোনো উপাদান বা তথ্য আপনি প্রকাশ, প্রেরণ বা প্রদান করবেন না, এবং আপনি নিশ্চয়তা দিচ্ছেন যে আপনার দেওয়া সব উপাদান ও তথ্য আপনার নিজের মৌলিক কাজ, কোনো তৃতীয় পক্ষ থেকে নেওয়া নয়।</p>

- model: TermsOfUse
  id: 19
  fields:
    title_bn: 4.5 কপিরাইট লঙ্ঘনের বিজ্ঞপ্তি
    content_bn: |
      <p style="text-align: justify;">বলো কবুল অন্যদের মেধাস্বত্বকে সম্মান করে। ওয়েবসাইটে এমন কোনো বিষয়বস্তু দেখলে যা আপনার বা কোনো তৃতীয় পক্ষের বলে মনে হয়, এবং তা এমনভাবে দেখানো হচ্ছে যা আপনার বা তৃতীয় পক্ষের কপিরাইট বা অন্য মেধাস্বত্ব লঙ্ঘন করছে বা করছে বলে মনে হয়, তাহলে নিচের তথ্যসহ support@bolokobul.com ঠিকানায় বিজ্ঞপ্তি পাঠাতে পারেন:</p>
      <p style="text-align: justify; margin-left: 40px;">১. আপনার যোগাযোগের তথ্য — ঠিকানা, টেলিফোন নম্বর ও ইমেইল ঠিকানাসহ;</p>
      <p style="text-align: justify; margin-left: 40px;">২. যে কাজ বা মেধাসম্পদ লঙ্ঘিত হয়েছে বা হয়েছে বলে সন্দেহ করছেন তার বিবরণ;</p>
      <p style="text-align: justify; margin-left: 40px;">৩. যে ওয়েবসাইটে লঙ্ঘনকারী বলে সন্দেহ করা উপাদানটি আছে তার নাম;</p>
      <p style="text-align: justify; margin-left: 40px;">৪. ওয়েবসাইটের কোথায় লঙ্ঘনকারী বলে সন্দেহ করা উপাদানটি আছে তার বিবরণ;</p>
      <p style="text-align: justify; margin-left: 40px;">৫. আপনার একটি বিবৃতি, যাতে:</p>
      <p style="margin-left: 80px;">(ক) আপনার সরল বিশ্বাস উল্লেখ থাকবে যে বিতর্কিত ব্যবহারটি কপিরাইট মালিক, তার প্রতিনিধি বা আইন দ্বারা অনুমোদিত নয়;</p>
      <p style="margin-left: 80px;">(খ) মিথ্যা সাক্ষ্যের শাস্তি সাপেক্ষে ঘোষণা থাকবে যে আপনার বিজ্ঞপ্তির তথ্য সঠিক ও সরল বিশ্বাসে দেওয়া, এবং আপনিই কপিরাইট বা মেধাস্বত্বের মালিক অথবা মালিকের পক্ষে কাজ করার অনুমতিপ্রাপ্ত।</p>

- model: TermsOfUse
  id: 20
  fields:
    title_bn: 4.6 বৈধ ব্যবহার
    content_bn: |
      <p>আপনাকে নিশ্চিত করতে হবে যে ওয়েবসাইটে আপনার প্রবেশ ও সেবা ব্যবহার আপনার জন্য প্রযোজ্য আইনে বেআইনি বা নিষিদ্ধ নয়। সব প্রযোজ্য আইনের অধীনে আপনার কাজের বৈধতার দায় সম্পূর্ণ আপনার।</p>

- model: TermsOfUse
  id: 21
  fields:
    title_bn: 4.7 ভাইরাসের ঝুঁকি
    content_bn: |
      <p>ওয়েবসাইটে প্রবেশের জন্য আপনার ব্যবহৃত প্রক্রিয়া যেন আপনাকে ভাইরাস, ক্ষতিকর কম্পিউটার কোড বা আপনার কম্পিউটার সিস্টেমের ক্ষতি করতে পারে এমন অন্য কোনো হস্তক্ষেপের ঝুঁকিতে না ফেলে, সে জন্য নিজেকেই সতর্কতা নিতে হবে। সন্দেহ এড়াতে স্পষ্ট করে বলা হচ্ছে, সেবা, ওয়েবসাইট বা কোনো সংযুক্ত ওয়েবসাইট ব্যবহারের সঙ্গে সম্পর্কিত আপনার কম্পিউটার সিস্টেমে কোনো হস্তক্ষেপ বা ক্ষতির দায় আমরা নিই না।</p>

- model: TermsOfUse
  id: 22
  fields:
    title_bn: 5.1 দায়মুক্তি
    content_bn: |
      <p style="text-align: justify;">আপনি স্পষ্টভাবে সম্মত হচ্ছেন যে ওয়েবসাইট ব্যবহারের সম্পূর্ণ ঝুঁকি আপনার।</p>
      <h3 style="text-align: justify;"><strong><span style="font-size:16px;">5.1.1 নির্ভুলতার কোনো নিশ্চয়তা নেই</span></strong></h3>
      <p style="text-align: justify;">এই ওয়েবসাইটে প্রকাশিত বিষয়বস্তু, তথ্য, সফটওয়্যার, পণ্য, সুবিধা ও সেবায় ভুল বা মুদ্রণজনিত ত্রুটি থাকতে পারে। এখানকার বিষয়বস্তুতে সময়ে সময়ে পরিবর্তন আনা হয়। বলো কবুল ও/অথবা এর সরবরাহকারীরা যেকোনো সময় এই ওয়েবসাইটে উন্নয়ন ও/অথবা পরিবর্তন করতে পারে। প্রয়োজনীয় রক্ষণাবেক্ষণ, টেলিযোগাযোগে বিঘ্ন বা অন্য কোনো বাধার কারণে ওয়েবসাইটটি সময়ে সময়ে সাময়িকভাবে বন্ধ থাকতে পারে। এই ওয়েবসাইটে প্রকাশিত বিষয়বস্তু, তথ্য, সফটওয়্যার, পণ্য, সুবিধা ও সেবার কিছু বা সব পরিবর্তন বা বন্ধ করার অধিকার প্রয়োগ করলে বলো কবুল (এবং এর মালিক, সরবরাহকারী, পরামর্শক, বিজ্ঞাপনদাতা, সহযোগী, অংশীদার, কর্মী বা অন্য কোনো সংশ্লিষ্ট প্রতিষ্ঠান) ব্যবহারকারী, সদস্য বা কোনো তৃতীয় পক্ষের কাছে দায়ী থাকবে না।</p>
      <p style="text-align: justify;">এই ওয়েবসাইটের বিষয়বস্তু, তথ্য, সফটওয়্যার, পণ্য, সুবিধা ও সেবা কোনো উদ্দেশ্যে উপযুক্ত কি না, সে বিষয়ে বলো কবুল ও/অথবা এর সংশ্লিষ্ট প্রতিষ্ঠানগুলো কোনো প্রতিশ্রুতি দেয় না। এসব বিষয়বস্তু, তথ্য, সফটওয়্যার, পণ্য, সুবিধা ও সেবা কোনো ধরনের নিশ্চয়তা ছাড়াই "যেমন আছে" অবস্থায় দেওয়া হয়। বাণিজ্যিক উপযোগিতা, নির্দিষ্ট উদ্দেশ্যে উপযুক্ততা, স্বত্ব, স্বত্ব লঙ্ঘন না হওয়া ও প্রাপ্যতার সব অন্তর্নিহিত নিশ্চয়তা ও শর্তসহ এসব বিষয়ে সব নিশ্চয়তা ও শর্ত বলো কবুল ও/অথবা এর সংশ্লিষ্ট প্রতিষ্ঠানগুলো এতদ্বারা অস্বীকার করে।</p>
      <h3 style="text-align: justify;"><strong><span style="font-size:16px;">5.1.2 কোনো নিশ্চয়তা নেই</span></strong></h3>
      <p style="text-align: justify;">এই ওয়েবসাইট ব্যবহার, ব্যবহারে বিলম্ব বা অক্ষমতা, এর মাধ্যমে পাওয়া কোনো বিষয়বস্তু, তথ্য, সফটওয়্যার, পণ্য, সুবিধা ও সেবা, অথবা অন্যভাবে এই ওয়েবসাইট ব্যবহার থেকে উদ্ভূত বা এর সঙ্গে সম্পর্কিত কোনো প্রত্যক্ষ, পরোক্ষ, শাস্তিমূলক, আনুষঙ্গিক, বিশেষ বা পরিণামগত ক্ষতির জন্য — চুক্তি, দেওয়ানি ক্ষতি, কঠোর দায় বা অন্য যেকোনো ভিত্তিতে হোক, এমনকি বলো কবুল বা এর কোনো সংশ্লিষ্ট প্রতিষ্ঠানকে ক্ষতির সম্ভাবনা সম্পর্কে আগে জানানো হলেও — কোনো অবস্থাতেই বলো কবুল ও/অথবা এর সংশ্লিষ্ট প্রতিষ্ঠানগুলো দায়ী থাকবে না।</p>
      <p style="text-align: justify;">উপরের বিষয়গুলো সীমিত না করে, বলো কবুল প্রকাশ্য বা অন্তর্নিহিত কোনো ধরনের প্রতিশ্রুতি বা নিশ্চয়তা দেয় না:</p>
      <p style="text-align: justify; margin-left: 40px;">(i) BoloKobul.com ওয়েবসাইটের পরিচালনা, অথবা এতে থাকা তথ্য, বিষয়বস্তু, উপাদান বা পণ্য সম্পর্কে;</p>
      <p style="text-align: justify; margin-left: 40px;">(ii) BoloKobul.com ওয়েবসাইট নিরবচ্ছিন্ন বা ত্রুটিমুক্ত থাকবে কি না সে সম্পর্কে;</p>
      <p style="text-align: justify; margin-left: 40px;">(iii) BoloKobul.com ওয়েবসাইটের মাধ্যমে দেওয়া কোনো তথ্য, বিষয়বস্তু, সেবা বা পণ্যের নির্ভুলতা, নির্ভরযোগ্যতা বা হালনাগাদ অবস্থা সম্পর্কে; অথবা</p>
      <p style="text-align: justify; margin-left: 40px;">(iv) BoloKobul.com ওয়েবসাইট, এর সার্ভার বা বলো কবুলের পক্ষ থেকে পাঠানো ইমেইল ভাইরাস, স্ক্রিপ্ট, ট্রোজান হর্স, ওয়ার্ম বা অন্য ক্ষতিকর উপাদানমুক্ত কি না সে সম্পর্কে।</p>
      <h3 style="text-align: justify;"><strong><span style="font-size:16px;">5.1.3 ক্ষতির দায় নেই</span></strong></h3>
      <p style="text-align: justify;">বলো কবুল ওয়েবসাইট ব্যবহার বা ব্যবহারে অক্ষমতা থেকে হওয়া কোনো ক্ষতির জন্য কোনো অবস্থাতেই বলো কবুল দায়ী থাকবে না; এর মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়, BoloKobul.com ওয়েবসাইট থেকে পাওয়া কোনো তথ্যের ওপর ব্যবহারকারীর নির্ভরতা, অথবা ভুল, বাদ পড়া, বিঘ্ন, ফাইল বা ইমেইল মুছে যাওয়া, ত্রুটি, খুঁত, ভাইরাস, পরিচালনা বা প্রেরণে বিলম্ব বা কাজে কোনো ব্যর্থতা থেকে হওয়া ক্ষতি — প্রাকৃতিক দুর্যোগ, যোগাযোগ ব্যর্থতা, চুরি, ধ্বংস বা বলো কবুলের রেকর্ড, প্রোগ্রাম বা সেবায় অননুমোদিত প্রবেশের কারণে হোক বা না হোক। ব্যবহারকারী এতদ্বারা স্বীকার করছেন যে এই অনুচ্ছেদ ওয়েবসাইটের মাধ্যমে পাওয়া সব বিষয়বস্তু, পণ্য ও সেবায় প্রযোজ্য।</p>

