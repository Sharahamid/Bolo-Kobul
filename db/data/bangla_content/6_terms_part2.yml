    title_bn: 7. বেআইনি বা নিষিদ্ধ ব্যবহার নয়
    content_bn: |
      <p style="text-align: justify;">এই ওয়েবসাইট ব্যবহারের শর্ত হিসেবে আপনি বলো কবুলকে নিশ্চয়তা দিচ্ছেন যে এই শর্তাবলি বা ওয়েবসাইটে থাকা অন্য কোনো শর্ত ও নোটিশে বেআইনি বা নিষিদ্ধ কোনো উদ্দেশ্যে ওয়েবসাইটটি ব্যবহার করবেন না।</p>
      <p style="text-align: justify;">আপনি ঘোষণা, নিশ্চয়তা ও অঙ্গীকার করছেন যে:</p>
      <p style="text-align: justify; margin-left: 40px;">(ক) ওয়েবসাইটের মাধ্যমে আপনাকে দেওয়া কোনো তথ্য, তা যিনি দিয়েছেন তার পূর্বানুমতি ছাড়া কাউকে প্রকাশ করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(খ) কোনো ধরনের হয়রানি বা আপত্তিকর আচরণে ওয়েবসাইট ব্যবহার করবেন না, যার মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়, যৌন ও/অথবা বর্ণগতভাবে আপত্তিকর, অপমানজনক, হুমকিমূলক, অশালীন, অশ্লীল, হয়রানিমূলক, মানহানিকর বা আপত্তিকর যেকোনো উপাদান, বেআইনি উপাদান অথবা অন্য পক্ষের অধিকার (মেধাস্বত্ব ও গোপনীয়তার অধিকারসহ) লঙ্ঘনকারী উপাদান বিতরণ;</p>
      <p style="text-align: justify; margin-left: 40px;">(গ) দলগত যৌন কার্যকলাপ, বিবাহবহির্ভূত সম্পর্কের উদ্দেশ্যে যোগাযোগ, পতিতাবৃত্তি বা আপনার বসবাসের দেশে বেআইনি হতে পারে এমন কোনো কাজে ওয়েবসাইট ব্যবহার করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঘ) অন্য কারও পরিচয় ধারণ করবেন না, আপনার বয়স বা বৈবাহিক অবস্থা ভুলভাবে উপস্থাপন করবেন না এবং প্রোফাইলে কোনোভাবে মিথ্যা বা বিভ্রান্তিকর তথ্য দেবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঙ) ইলেকট্রনিক বা অন্য উপায়ে সেবা থেকে অন্য ব্যবহারকারীদের ইমেইল ঠিকানা বা যোগাযোগের তথ্য সংগ্রহ করবেন না, এবং "স্প্যাম", চেইন লেটার, জাংক মেইল পাঠাতে বা অযাচিত গণ-ইমেইল পাঠাতে সেবা ব্যবহার করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(চ) কোনো অননুমোদিত বাণিজ্যিক উদ্দেশ্যে ওয়েবসাইট ব্যবহার করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ছ) কোনো সদস্য বা আমাদের সেবার অন্য ব্যবহারকারীর কাছে টাকা, ব্যাংক অ্যাকাউন্ট, ক্রেডিট কার্ডের তথ্য বা গোপন আর্থিক তথ্য চাইবেন না বা চাওয়ার চেষ্টা করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(জ) ওয়েবসাইটের মাধ্যমে যার সঙ্গে যোগাযোগ বা পরিচয় হয়েছে, তাকে টাকা পাঠাবেন না বা আর্থিক তথ্য দেবেন না। এ ধরনের আচরণের ফলে আপনার কোনো ক্ষতি (আর্থিক বা অন্য) হলে বলো কবুল দায়ী থাকবে না। কেউ টাকা চাইলে বা আর্থিক তথ্য নেওয়ার চেষ্টা করলে সংশ্লিষ্ট সদস্যের প্রোফাইল ও ঘটনার বিবরণসহ support@bolokobul.com ঠিকানায় ইমেইল করে গ্রাহক সহায়তাকে জানাতে আপনি সম্মত হচ্ছেন;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঝ) অন্য সদস্যদের কাছে পাসওয়ার্ড চাইবেন না বা চাওয়ার চেষ্টা করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঞ) তহবিল সংগ্রহ, বিজ্ঞাপন বা পণ্য ও সেবা বিক্রির আহ্বানসংবলিত কোনো উপাদান বিতরণ, প্রচার বা প্রকাশে ওয়েবসাইট ব্যবহার করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ট) কেউ স্পষ্টভাবে যোগাযোগ বন্ধ করতে বলার পরও তার সঙ্গে যোগাযোগের চেষ্টা চালিয়ে হয়রানি করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঠ) কম্পিউটার সফটওয়্যার বা হার্ডওয়্যারের কার্যক্ষমতা সীমিত বা নষ্ট করার জন্য তৈরি ভাইরাস বা অন্য কম্পিউটার কোড, ফাইল বা প্রোগ্রামযুক্ত উপাদান প্রকাশ বা প্রেরণ করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ড) প্রকাশ্য তথ্যের মাধ্যমে ইমেইল ঠিকানা, ফোন নম্বর, ডাক ঠিকানা, ইনস্ট্যান্ট মেসেঞ্জার আইডি, ফেসবুক ইউজারনেম, ওয়েব ঠিকানা (URL) বা পূর্ণ নামসহ কোনো যোগাযোগের তথ্য প্রকাশ বা প্রেরণ করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ঢ) ওয়েবসাইটে লগইন করতে মানুষ নয় এমন বা স্বয়ংক্রিয় বট ব্যবহার করবেন না;</p>
      <p style="text-align: justify; margin-left: 40px;">(ণ) ফোনে বা অন্য কোনো মাধ্যমে আমাদের গ্রাহকসেবা কর্মী বা ঘটকদের সঙ্গে কথা বলার সময় অপমানজনক, অশ্লীল, কুরুচিপূর্ণ, আপত্তিকর, যৌনতানির্ভর, হুমকিমূলক, হয়রানিমূলক বা বর্ণগতভাবে আপত্তিকর আচরণ করবেন না (“আপত্তিকর আচরণ”)। আপনি সম্মত হচ্ছেন যে আমাদের একক বিবেচনায় আপত্তিকর আচরণ করলে আমরা সঙ্গে সঙ্গে আপনার সদস্যপদ বাতিল করতে এবং বিস্তারিত তথ্য যথাযথ আইনশৃঙ্খলা রক্ষাকারী সংস্থাকে জানাতে পারব;</p>
      <p style="text-align: justify; margin-left: 40px;">(ত) আপনার বয়স ১৮-এর বেশি। আমাদের ওয়েবসাইটের সব সদস্যের বয়স ১৮-এর বেশি হতে হবে। অপ্রাপ্তবয়স্ক কারও সঙ্গে কোনো সদস্যের যেকোনো ধরনের সাইবার যৌনতা, যৌন বার্তালাপ বা যৌন সংস্পর্শের চেষ্টার ব্যাপারে আমাদের শূন্য সহনশীলতা। অপ্রাপ্তবয়স্কের সঙ্গে কোনো বেআইনি বা অনুচিত যোগাযোগের খবর পেলে আমরা বিস্তারিত তথ্য যথাযথ আইনশৃঙ্খলা রক্ষাকারী সংস্থাকে জানাতে পারি।</p>

- model: TermsOfUse
  id: 25
  fields:
    title_bn: 8.1 তথ্য পর্যবেক্ষণ
    content_bn: |
      <p>এই শর্তাবলির প্রয়োজনীয়তা মানা হচ্ছে কি না নিশ্চিত করতে সব প্রোফাইল, বার্তা, চ্যাট, ইনস্ট্যান্ট মেসেজ, ভিডিও ও অডিও রেকর্ডিং পর্যবেক্ষণের অধিকার আমরা রাখি। গ্রাহকদের সর্বোচ্চ মানের সেবা ও সবচেয়ে নিরাপদ অনলাইন পরিবেশ দিতে আমরা গ্রাহকদের অনলাইন নিরাপত্তার জন্য এক বা একাধিক তৃতীয় পক্ষকে নিযুক্ত করেছি। এই নিরাপত্তা দিতে আমাদের ওয়েবসাইটে যুক্ত হওয়ার জন্য ব্যবহৃত আপনার কম্পিউটার বা অন্য ডিভাইস থেকে কিছু অ-ব্যক্তিগত তথ্য সংগ্রহ করতে হয়। আপনার জন্য নিরাপদ অনলাইন পরিবেশ নিশ্চিত করার একমাত্র উদ্দেশ্যে, সরাসরি বা তৃতীয় পক্ষের নিরাপত্তা সরবরাহকারীর মাধ্যমে, কিছু অ-ব্যক্তিগত তথ্য সংগ্রহে আপনি স্পষ্টভাবে সম্মতি দিচ্ছেন। কোনো ব্যক্তিগত তথ্য সংগ্রহ না করা হলেও আমরা নিশ্চিত করি যে নিরাপত্তা সেবার জন্য চুক্তিবদ্ধ তৃতীয় পক্ষগুলো সর্বোচ্চ তথ্য সুরক্ষা ও গোপনীয়তার মান মেনে চলে।</p>

- model: TermsOfUse
  id: 26
  fields:
    title_bn: 8.2 সীমিত ব্যবহার
    content_bn: |
      <p>আমরা লিখিতভাবে ভিন্ন কিছুতে সম্মত না হলে ওয়েবসাইটটি শুধু আপনার ব্যক্তিগত ব্যবহারের জন্য। ব্যবসা, গোষ্ঠী, সংগঠন ও প্রতিষ্ঠানের সদস্য হিসেবে নিবন্ধন নিষিদ্ধ। প্রিন্ট করা স্পষ্টভাবে নিষিদ্ধ না থাকলে ব্যক্তিগত ব্যবহারের জন্য ওয়েবসাইটের যেকোনো তথ্যের একটি কপি প্রিন্ট করতে পারেন।</p>

- model: TermsOfUse
  id: 27
  fields:
    title_bn: 8.3 তথ্য সম্পাদনা
    content_bn: |
      <p>সেবার সদস্যদের প্রকাশিত বা পাঠানো সব বার্তা বা উপাদান আমরা পর্যালোচনা করি না এবং করতে পারি না, এবং এসব বার্তা বা উপাদানের বিষয়বস্তুর জন্য দায়ী নই; তবে আমাদের একক বিবেচনায় এই শর্তাবলি লঙ্ঘনকারী বা অন্যভাবে অগ্রহণযোগ্য বলে মনে হওয়া বার্তা বা উপাদান (প্রোফাইল, বার্তা, ভিডিও ও অডিও রেকর্ডিংসহ) মুছে ফেলা, সরানো বা সম্পাদনার অধিকার আমরা রাখি, যদিও তা করতে বাধ্য নই।</p>

- model: TermsOfUse
  id: 28
  fields:
    title_bn: 8.4 তথ্যের নিরাপত্তা
    content_bn: |
      <p>দুর্ভাগ্যবশত ইন্টারনেটে কোনো তথ্য প্রেরণ পুরোপুরি নিরাপদ, এমন নিশ্চয়তা দেওয়া যায় না। এ ধরনের তথ্য সুরক্ষায় আমরা সচেষ্ট থাকলেও আপনি আমাদের কাছে যে তথ্য পাঠান, অথবা আমাদের গোপনীয়তা বিবৃতি অনুযায়ী অনুমোদিত তৃতীয় পক্ষের কাছে আমরা যে তথ্য পাঠাই, তার নিরাপত্তার নিশ্চয়তা আমরা দিই না এবং দিতে পারি না। সে কারণে আপনি স্পষ্টভাবে স্বীকার করছেন যে আমাদের কাছে পাঠানো যেকোনো তথ্য আপনার নিজের ঝুঁকিতে পাঠানো হয়।</p>
      <p style="text-align: justify;">আপনি আরও স্পষ্টভাবে সম্মতি দিচ্ছেন যে সংশ্লিষ্ট ঝুঁকি পুরোপুরি জেনে, বিশেষ করে যেসব দেশে আপনার বসবাসের দেশের মতো বা সমপর্যায়ের সুরক্ষা নেই, আপনার বসবাসের দেশের ভেতরে ও বাইরে অনুমোদিত তৃতীয় পক্ষের কাছে আমরা আপনার ব্যক্তিগত তথ্য পাঠাতে পারি। আমাদের গোপনীয়তা বিবৃতিতে বর্ণিত প্রক্রিয়া অনুযায়ী যেকোনো সময় আপনি সম্মতি প্রত্যাহার বা আপনার ব্যক্তিগত তথ্য ব্যবহারে আপত্তি জানাতে পারেন।</p>
      <p style="text-align: justify;">উপরের বিষয়গুলো সত্ত্বেও আপনার পাঠানো তথ্য আমাদের কাছে পৌঁছানোর পর তার নিরাপত্তা রক্ষায় আমরা যুক্তিসংগত পদক্ষেপ নেব।</p>

- model: TermsOfUse
  id: 29
  fields:
    title_bn: 9.1 যোগাযোগ
    content_bn: |
      <p>সেবার পরিবর্তন বা সংযোজন, অথবা বলো কবুল ও এর সহযোগী ব্যবসার যেকোনো পণ্য ও সেবা সম্পর্কে আপনাকে ইমেইল পাঠানোর অধিকার বলো কবুল রাখে।</p>

- model: TermsOfUse
  id: 30
  fields:
    title_bn: 9.2 মেধাস্বত্বের মালিকানা
    content_bn: |
      <p>সেবা ও ওয়েবসাইট এবং এর সংশ্লিষ্ট মেধাস্বত্বের সব অধিকার, স্বত্ব ও স্বার্থ বলো কবুলের, এবং স্পষ্টভাবে দেওয়া হয়নি এমন সব অধিকার বলো কবুল সংরক্ষণ করে।</p>

- model: TermsOfUse
  id: 31
  fields:
    title_bn: 9.3 কপিরাইট
    content_bn: |
      <p>সেবা ও ওয়েবসাইটের (লেখা, গ্রাফিক্স, লোগো, আইকন, শব্দ রেকর্ডিং ও সফটওয়্যারসহ) কপিরাইটের মালিক বা লাইসেন্সধারী বলো কবুল। এই শর্তাবলিতে স্পষ্টভাবে অনুমতি দেওয়া ছাড়া আপনি কোনো রূপে বা কোনো উপায়ে:</p>
      <p style="text-align: justify; margin-left: 40px;">(ক) সেবা বা ওয়েবসাইটের কোনো অংশ রূপান্তর, পুনরুৎপাদন, সংরক্ষণ, বিতরণ, প্রিন্ট, প্রদর্শন, পরিবেশন, প্রকাশ বা তা থেকে নতুন কাজ তৈরি করতে পারবেন না; অথবা</p>
      <p style="text-align: justify; margin-left: 40px;">(খ) সেবা বা ওয়েবসাইটের কোনো অংশ থেকে পাওয়া তথ্য, পণ্য বা সেবা বাণিজ্যিকভাবে ব্যবহার করতে পারবেন না;</p>
      <p style="text-align: justify;">আমাদের পূর্ব লিখিত অনুমতি ছাড়া।</p>

