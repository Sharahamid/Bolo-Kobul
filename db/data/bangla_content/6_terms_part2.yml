      <p style="text-align: justify;">এই চুক্তির শর্তাবলি সম্পূর্ণভাবে আইনের ওপর ভিত্তি করে এবং আইনের অধীন। এই ওয়েবসাইট ব্যবহার থেকে উদ্ভূত বা এর সঙ্গে সম্পর্কিত সব বিরোধে আদালতের একক এখতিয়ার ও স্থান নির্ধারিত হবে — এতে আপনি এতদ্বারা সম্মতি দিচ্ছেন। যে এখতিয়ারে এই অনুচ্ছেদসহ এই শর্তাবলির সব বিধান কার্যকর হয় না, সেখানে এই ওয়েবসাইটের ব্যবহার অননুমোদিত।</p>
      <p>এই চুক্তি গণপ্রজাতন্ত্রী বাংলাদেশের আইন অনুযায়ী পরিচালিত ও ব্যাখ্যাত হবে। এই শর্তাবলি থেকে উদ্ভূত বা এর সঙ্গে সম্পর্কিত যেকোনো বিরোধ বাংলাদেশের আদালতের একক এখতিয়ারাধীন থাকবে।</p>
      <p>BoloKobul.com ব্যবহারের মাধ্যমে আপনি বাংলাদেশের সব প্রযোজ্য আইন মেনে চলতে সম্মত হচ্ছেন, যার মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়:</p>
      <ul>
        <li><strong>ডিজিটাল নিরাপত্তা আইন, ২০১৮</strong> — অনলাইনে মিথ্যা, অশ্লীল বা মানহানিকর বিষয়বস্তু শেয়ার নিষিদ্ধ করে</li>
        <li><strong>তথ্য ও যোগাযোগ প্রযুক্তি (আইসিটি) আইন, ২০০৬</strong> — ইলেকট্রনিক লেনদেন ও ডিজিটাল যোগাযোগ নিয়ন্ত্রণ করে</li>
        <li><strong>ব্যক্তিগত তথ্য সুরক্ষা (প্রস্তাবিত কাঠামো)</strong> — বাংলাদেশের নতুন তথ্য সুরক্ষা মানদণ্ড অনুযায়ী ব্যবহারকারীর তথ্য সুরক্ষায় বলো কবুল প্রতিশ্রুতিবদ্ধ</li>
        <li><strong>মুসলিম পারিবারিক আইন অধ্যাদেশ, ১৯৬১</strong> — বিয়ের উদ্দেশ্য প্রযোজ্য ব্যক্তিগত ও পারিবারিক আইনের সঙ্গে সামঞ্জস্যপূর্ণ কি না, তা নিশ্চিত করার দায় ব্যবহারকারীর</li>
        <li><strong>পর্নোগ্রাফি নিয়ন্ত্রণ আইন, ২০১২</strong> — প্ল্যাটফর্মে যেকোনো অশ্লীল বিষয়বস্তু কঠোরভাবে নিষিদ্ধ</li>
      </ul>
      <p>যেকোনো বেআইনি কার্যকলাপ সংশ্লিষ্ট বাংলাদেশি কর্তৃপক্ষকে জানানোর অধিকার বলো কবুল রাখে।</p>
