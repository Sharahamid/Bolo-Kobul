      <p style="text-align: justify; margin-left: 40px;">(iii) আপনার দ্বারা যেকোনো আইন লঙ্ঘন; এবং</p>
      <p style="text-align: justify; margin-left: 40px;">(iv) ওয়েবসাইটের সঙ্গে সম্পর্কিত আপনার যেকোনো কাজ বা কাজ না করা।</p>
