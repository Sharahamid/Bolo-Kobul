- model: Faq
  id: 16
  fields:
    title_bn: যেভাবে কাজ করে
    content_bn: |
      <p><strong>এই সাইট কি শুধু তাদের জন্য, যাদের চূড়ান্ত লক্ষ্য বিয়ে?</strong></p>
      <p>হ্যাঁ, আমরা শুধু বিয়ের ওপরই গুরুত্ব দিই। এটি সাধারণ ডেটিং ওয়েবসাইট নয়।</p>
      <p><strong>সাবমিটার ও ক্যান্ডিডেট কে?</strong></p>
      <p>যার জন্য জীবনসঙ্গী খোঁজা হচ্ছে, তাকে বলা হয় "ক্যান্ডিডেট"। সহজ কথায়, উপযুক্ত মিল পাওয়ার পর যিনি বিয়ে করবেন তিনিই ক্যান্ডিডেট। প্রত্যেক ক্যান্ডিডেটের আমাদের সিস্টেমে একটি প্রোফাইল থাকে, যেখানে তার বিবরণ দেওয়া থাকে। যিনি ক্যান্ডিডেটের প্রোফাইল তৈরি করেন, তাকে বলা হয় "সাবমিটার"। একই ব্যক্তি একটি প্রোফাইলের সাবমিটার ও ক্যান্ডিডেট দুটোই হতে পারেন।</p>
      <p><strong>প্রোফাইল কী?</strong></p>
      <p>প্রোফাইল হলো বিয়ে করতে ইচ্ছুক একজন ক্যান্ডিডেটের বিবরণ। এতে ক্যান্ডিডেটের ছবি, শারীরিক বৈশিষ্ট্য, আগ্রহসহ নানা তথ্য থাকে।</p>
      <p><strong>বাটারফ্লাই কীভাবে কাজ করে?</strong></p>
      <p>প্রত্যেক সদস্য ৩টি বাটারফ্লাই বিনামূল্যে পান। কাউকে বাটারফ্লাই পাঠালে সেটি আপনার কবুল ১। তিনি একটি ফেরত পাঠালে কবুল ২ (পারস্পরিক মিল) খুলে যায়। দুজনের পারস্পরিক মিল হলে এবং দুজনেই চ্যাট করতে চাইলে কবুল ৩ চালু হয়।</p>
      <p><strong>৩ কবুল পদ্ধতি কী?</strong></p>
      <p>বলো কবুল একটি অনন্য ৩ ধাপের মিল পদ্ধতি ব্যবহার করে। কবুল ১: আগ্রহ জানাতে আপনি একটি কবুল (বাটারফ্লাই) পাঠান। কবুল ২: অপরজনও আপনাকে কবুল পাঠালে আপনাদের পারস্পরিক মিল হয় এবং একে অপরের পূর্ণ প্রোফাইল দেখতে পারেন। কবুল ৩: মিল হলে গোপনে ও নিরাপদে কথা বলার জন্য চ্যাট চালু হয়।</p>
      <p><strong>ব্যক্তিগত ও প্রকাশ্য তথ্য কী?</strong></p>
      <ul>
        <li>ব্যক্তিগত তথ্য: ক্যান্ডিডেট সম্পর্কে সব তথ্য। এই তথ্য দেখতে অন্য সদস্যদের অনুমতি লাগে, এবং ক্যান্ডিডেট বাটারফ্লাই গ্রহণ করলেই কেবল তা দেখা যায়।</li>
        <li>প্রকাশ্য তথ্য: প্রোফাইলের একটি অংশ, যা সার্চ ও সুপারিশে দেখা যায়। এটি দেখতে অন্য সদস্যদের অনুমতি লাগে না।</li>
      </ul>
      <p><strong>"ফেভারিটে যোগ করুন" অপশনটি কী?</strong></p>
      <p>কোনো ক্যান্ডিডেটের প্রোফাইলের প্রকাশ্য তথ্য দেখে যদি প্রোফাইলটি পরে দেখার জন্য মনে রাখতে চান, অথবা বাটারফ্লাই পাঠানোর আগে পরিবারকে দেখাতে চান, তাহলে প্রোফাইলটি আপনার ফেভারিটে যোগ করতে পারেন। পরে এখান থেকে ফেভারিট তালিকা দেখতে পারবেন: <a href="https://www.bolokobul.com/favourites" target="_blank">ফেভারিট</a>।</p>
      <p><strong>ব্যক্তিগত তথ্য দেখার অনুরোধ কীভাবে পাঠাব?</strong></p>
      <p>যেকোনো সদস্য অনুমতি ছাড়াই অন্য সদস্যের প্রোফাইলের প্রকাশ্য তথ্য দেখতে পারেন। তবে সেই প্রোফাইলের ব্যক্তিগত তথ্য দেখতে প্রোফাইলটি যিনি তৈরি করেছেন তার অনুমতি লাগে। এজন্য আপনার পছন্দের সদস্যকে একটি বাটারফ্লাই পাঠাতে হবে। ক্যান্ডিডেটের আপনার প্রোফাইল পছন্দ হলে তিনিও একটি বাটারফ্লাই পাঠাবেন। দুটি বাটারফ্লাই মিলে গেলে আপনারা দুজনেই নাম, ফোন নম্বর, পূর্ণ ঠিকানা ও ইমেইল ঠিকানা ছাড়া একে অপরের পুরো প্রোফাইল দেখতে পারবেন। ব্যক্তিগত তথ্য দেখার অনুরোধ অনুমোদিত হলে দুজনেই মেসেজ বক্সের মাধ্যমে একে অপরকে বার্তা পাঠাতে পারবেন। আমাদের পক্ষ থেকে কোনো যোগাযোগের তথ্য শেয়ার করা হয় না। চ্যাটের সময় কী শেয়ার করবেন, তা সম্পূর্ণ আপনার সিদ্ধান্ত। তবে কোনো ব্যাংক বা কার্ডের তথ্য প্রকাশ না করার অনুরোধ রইল। নিরাপদ থাকুন এবং সাবধানে তথ্য শেয়ার করুন।</p>
      <p><strong>সহায়তা সেবা কী?</strong></p>
      <ul>
        <li>ফর্ম পূরণে আমাদের প্রতিনিধির সাহায্য নেওয়া। এটি ফোনে বা আপনার পছন্দের যেকোনো মাধ্যমে করা যায়।</li>
        <li>জীবনসঙ্গী খুঁজতে আমাদের প্ল্যাটফর্মের অভিজ্ঞ ঘটকের সাহায্য নেওয়া। পছন্দের তালিকা করতে আপনাকে নিজে প্রোফাইল ঘাঁটতে হবে না, নির্ধারিত ঘটক আপনার হয়ে তা করবেন।</li>
        <li>প্রথম সাক্ষাতে যাওয়ার সময় একজন ঘটককে সঙ্গে নেওয়া। জড়তা কাটাতে অনেকে এটি পছন্দ করেন।</li>
      </ul>
      <p>এগুলো পেইড সেবা।</p>
      <p><strong>কীভাবে পেমেন্ট করব?</strong></p>
      <p>ডেবিট/ক্রেডিট কার্ড দিয়ে অনলাইনে পেমেন্ট করতে পারেন। আমাদের সাইটে পেমেন্ট করার সময় আপনি কীভাবে দিতে চান তা জিজ্ঞেস করা হবে। সব ফি ও পেমেন্ট টাকায় (BDT) হিসাব করা হয়।</p>
      <p><strong>পেইড সেবাগুলো কী কী?</strong></p>
      <p>নিবন্ধন ও প্রোফাইল তৈরি সম্পূর্ণ বিনামূল্যে! প্রোফাইল দেখা ও বাটারফ্লাই পাঠানোর জন্যও টাকা লাগে না। তবে প্রত্যেক সদস্য ৩টি বাটারফ্লাই পান। আরও বেশি প্রোফাইল দেখতে চাইলে দৈনিক আরও প্রোফাইল দেখার সুযোগ এবং আরও বাটারফ্লাই কিনতে হবে। বাটারফ্লাই কিনতে পারবেন এখান থেকে: <a href="https://www.bolokobul.com/orders/new" target="_blank">আরও বাটারফ্লাই নিন</a>।</p>
      <p>অন্যান্য ঐচ্ছিক খরচের মধ্যে রয়েছে:</p>
      <ul>
        <li>যাচাইকৃত প্রোফাইল: প্রোফাইল যাচাই করাতে চাইলে। যাচাইকৃত প্রোফাইল বিশ্বস্ত হিসেবে গণ্য হয়, তাই বেশি সাড়া পাওয়া যায়।</li>
        <li>স্পটলাইট: হাজারো প্রোফাইলের মধ্যে সার্চ ফলাফলে আপনার প্রোফাইল আলাদাভাবে তুলে ধরতে এবং যোগাযোগের সম্ভাবনা বাড়াতে চাইলে।</li>
        <li>ব্যক্তিগত ঘটক সেবা: প্রোফাইল দেখার সময় না থাকলে একজন নির্ধারিত অভিজ্ঞ ঘটক নিতে পারেন, যিনি আপনার বিষয়টি দেখবেন এবং আপনার পছন্দের মাধ্যমে যোগাযোগ করে প্রয়োজন ও প্রক্রিয়া নিয়ে আলোচনা করবেন।</li>
        <li>নোটিফিকেশনের জন্য এসএমএস সতর্কবার্তা: কেউ আপনার প্রোফাইলে আগ্রহ দেখালে বা চ্যাটে বার্তা এলে মোবাইলে নোটিফিকেশন পেতে চাইলে। এই সুবিধা প্রতি মাসে নবায়ন করতে হয়।</li>
        <li>চ্যাট: আপনি কারও প্রোফাইল পছন্দ করলে এবং তিনিও আপনার প্রোফাইল পছন্দ করলে দুজনে চ্যাট করতে রাজি হতে পারেন। পেমেন্টের পর এই অপশন চালু হবে।</li>
        <li>সাক্ষাতের সময় সহায়তা সেবা: প্রথম সাক্ষাৎ সহজভাবে সারতে একজন ঘটক সঙ্গে নিতে চাইলে।</li>
      </ul>
      <p><strong>কীভাবে ঘটক বেছে নেব?</strong></p>
      <p>আমরা মনোযোগী ও নিবেদিত সেবা দিতে চাই, তাই প্রাপ্যতা অনুযায়ী আপনাকে একজন ঘটক দেওয়া হবে। নির্ধারিত ঘটকের সঙ্গে স্বস্তি বোধ না করলে নির্দ্বিধায় পরিবর্তনের অনুরোধ করুন।</p>
      <p><strong>সাক্ষাতের সময় ঘটককে কত টাকা দিতে হবে?</strong></p>
      <p>ঘটককে সামনাসামনি আলাদা করে কিছু দিতে হবে না। সেবার ফি আগেই ওয়েবসাইট থেকে নেওয়া হবে।</p>

- model: Faq
  id: 17
  fields:
    title_bn: নিবন্ধন ও প্রোফাইল তৈরি
    content_bn: |
      <p><strong>BoloKobul.com-এ কীভাবে নিবন্ধন করব?</strong></p>
      <p>নিবন্ধন ফর্মে প্রয়োজনীয় তথ্য যথাসম্ভব সঠিকভাবে পূরণ করুন এবং প্রশ্নগুলোর শেষে 'জমা দিন' বোতামে চাপুন। ব্যস!</p>
      <p>এখনই BoloKobul.com-এ নিবন্ধন করে আপনার প্রোফাইল তৈরি করুন। ভালোবাসা আপনাকে খুঁজে নেওয়ার অপেক্ষায় বসে থাকবেন না!</p>
      <p><strong>আত্মীয় বা বন্ধুর পক্ষ থেকে কি নিবন্ধন করতে পারি?</strong></p>
      <p>হ্যাঁ, পারেন। নিবন্ধন ফর্মে যার পক্ষ থেকে নিবন্ধন করছেন, তার সঙ্গে আপনার সম্পর্ক উল্লেখ করতে পারবেন।</p>
      <p><strong>BoloKobul.com-এ নিবন্ধন করতে কত টাকা লাগে?</strong></p>
      <p>BoloKobul.com-এ নিবন্ধন সম্পূর্ণ বিনামূল্যে।</p>
      <p><strong>BoloKobul.com-এ নিবন্ধনের সুবিধা কী?</strong></p>
      <p>নিচের সেবাগুলো বিনামূল্যে পাবেন:</p>
      <ul>
        <li>BoloKobul.com-এ নিজের প্রোফাইল তৈরি ও পরিচালনা</li>
        <li>প্রোফাইলে ছবি যোগ করা</li>
        <li>জীবনসঙ্গীর পছন্দ যোগ করা — কেমন মানুষ খুঁজছেন</li>
        <li>উপযুক্ত প্রোফাইল খোঁজা ও দেখা</li>
        <li>পছন্দের প্রোফাইল তালিকায় রাখা</li>
        <li>অন্য সদস্যদের প্রতি আগ্রহ জানানো এবং যারা আপনার প্রতি আগ্রহ দেখান তাদের উত্তর দেওয়া (এটি আপনাকে দেওয়া ৩টি বাটারফ্লাইয়ের মধ্যে সীমিত; ৩ জনের বেশি সদস্যের প্রতি আগ্রহ জানাতে চাইলে প্রয়োজনমতো বাটারফ্লাই কিনতে হবে)</li>
      </ul>
      <p><strong>BoloKobul.com-এ নিবন্ধন ও প্রোফাইল তৈরিতে কত সময় লাগে?</strong></p>
      <p>BoloKobul.com-এ নিবন্ধন ও প্রোফাইল তৈরি ১০ মিনিটেরও কম সময়ে শেষ করা যায়। নিবন্ধনের ১টি ধাপ এবং বেশিরভাগই তালিকা থেকে উত্তর বেছে নেওয়ার ৮টি সহজ ধাপে আপনার প্রোফাইল তৈরি হয়ে যাবে।</p>
      <p><strong>ফর্মটি একটু লম্বা মনে হচ্ছে। পুরোটা কি পূরণ করতে হবে?</strong></p>
      <p>আমরা বুঝি, একবারে লম্বা ফর্ম পূরণ করা ক্লান্তিকর হতে পারে। তবে বিয়ের সিদ্ধান্ত গুরুত্বপূর্ণ, তাই আগ্রহী সদস্যদের নিজের সম্পর্কে বিস্তারিত তথ্য জানানো উচিত। নিজের সম্পর্কে যত বেশি তথ্য দেবেন, অন্য সদস্যদের কাছ থেকে যোগাযোগ পাওয়ার সম্ভাবনা তত বাড়বে। তাই সময় নিয়ে প্রোফাইলটি সম্পূর্ণ করুন।</p>
      <p>তাড়া থাকলে ফর্মের কিছু অংশ বাদ দিয়ে পরে ফিরে এসে নিবন্ধন সম্পূর্ণ করতে পারেন।</p>
      <p><strong>নিবন্ধন ও প্রোফাইল তৈরির সময় বাধ্যতামূলক ঘরগুলো কি বাদ দিতে পারি?</strong></p>
      <p>না। নিবন্ধন ও প্রোফাইল তৈরি সম্পূর্ণ করতে সব বাধ্যতামূলক ঘর পূরণ করতে হবে। এই ঘরগুলো আপনার প্রোফাইল দেখা সদস্যদের আপনার সম্পর্কে প্রয়োজনীয় তথ্য দেয়।</p>
      <p><strong>নিবন্ধনের সময় কি একাধিক ইমেইল দিতে পারি?</strong></p>
      <p>না। নিবন্ধনের সময় শুধু একটি ইমেইল দেওয়া যায়। তবে চাইলে পরে ইমেইল ঠিকানা বদলাতে পারবেন।</p>
      <p><strong>আমার উত্তরটি নিবন্ধন ফর্মের তালিকায় নেই। কী করব?</strong></p>
      <p>নিবন্ধন ফর্মের তালিকাগুলো তৈরির সময় আমরা যতটা সম্ভব সব রাখার চেষ্টা করেছি। তবু আপনার নির্দিষ্ট উত্তরটি তালিকায় না থাকতে পারে।</p>
      <p>সেক্ষেত্রে দেওয়া 'অন্যান্য' অপশনটি ব্যবহার করুন। এছাড়া <b>support@bolokobul.com</b> ঠিকানায় ইমেইল করে নিবন্ধন ফর্মে কী যোগ করতে চান তা স্পষ্টভাবে জানাতে পারেন। আপনার প্রস্তাব গৃহীত হবেই এমন নিশ্চয়তা দিতে না পারলেও আমরা যথাসাধ্য চেষ্টা করব।</p>
      <p><strong>নিবন্ধন ফর্মে এমন তথ্য চাওয়া হয়েছে যা আমি নিশ্চিত জানি না। কী করব?</strong></p>
      <p>এই তথ্যগুলো সাধারণত মিল খোঁজার কাজে লাগে। উত্তর নিশ্চিত না জানলে ঘরগুলো খালি রাখতে পারেন। তবে আমরা পরামর্শ দিই, উত্তরগুলো জেনে পরে যোগ করুন। এতে আরও ভালো মিল পাওয়া যাবে এবং আপনার প্রোফাইল আরও বেশি সদস্যের কাছে পৌঁছাবে।</p>
      <p><strong>প্রোফাইল আইডি কী? এটি কি গুরুত্বপূর্ণ?</strong></p>
      <p>প্রোফাইল আইডি ওয়েবসাইট নিজে থেকে তৈরি করে, এবং এটি BoloKobul.com-এ আপনার প্রোফাইলকে আলাদাভাবে চিহ্নিত করে। প্রত্যেক সদস্যের প্রোফাইল আইডি আলাদা। তবে এটি নিবন্ধনের ক্রম নির্দেশ করে না, এটি এলোমেলোভাবে তৈরি হয়।</p>
      <p>অন্য সদস্যরা প্রোফাইল আইডি দিয়ে খোঁজার সুবিধা ব্যবহার করে আপনার প্রোফাইল খুঁজে পেতে পারেন।</p>
      <p><strong>BoloKobul.com-এ প্রোফাইল তৈরির সময় কী করা উচিত আর কী উচিত নয়?</strong></p>
      <p>এটি বাণিজ্যিক কাজে ব্যবহার করবেন না এবং অশ্লীল, পর্নোগ্রাফিক বা বর্ণবাদী কোনো বিষয় রাখবেন না। কোন ধরনের বিষয়বস্তু নিষিদ্ধ, তা বিস্তারিত জানতে আমাদের <a href="https://bolokobul.com/terms_of_uses">শর্তাবলি</a> দেখুন।</p>
      <p>প্রোফাইল তৈরির সময় যতটা সম্ভব বিস্তারিত লিখুন। প্রোফাইল চালু হওয়ার পর জীবনসঙ্গীর পছন্দ পূরণ করতে এবং একটি ছবি আপলোড করতে ভুলবেন না। যত বেশি তথ্য যোগ করবেন, জীবনসঙ্গী খুঁজে পাওয়ার সম্ভাবনা তত বাড়বে।</p>
      <p><strong>নিবন্ধনের সময় বার্তা এলো যে আমার ইমেইল আগেই BoloKobul.com-এ নিবন্ধিত, অন্য ইমেইল দিতে হবে। কেন এমন হলো?</strong></p>
      <p>BoloKobul.com-এর প্রতিটি প্রোফাইল শুধু একটি নির্দিষ্ট ইমেইলের সঙ্গে যুক্ত। আপনি বা অন্য কেউ এই ইমেইল দিয়ে আগেই প্রোফাইল তৈরি করে থাকলে এই বার্তা দেখাতে পারে। আপনার ইমেইল অন্য কেউ ব্যবহার করছে মনে হলে, সংশ্লিষ্ট ইমেইল ঠিকানা থেকেই আমাদের ইমেইল করে জানান।</p>
      <p><strong>জীবনসঙ্গীর পছন্দ কেন ঠিক করব?</strong></p>
      <p>জীবনসঙ্গীর পছন্দ ঠিক করলে আপনি কেমন মানুষ খুঁজছেন তা আমরা আরও ভালোভাবে বুঝতে পারি, আর আমাদের এআই আপনার জন্য আরও মানানসই প্রোফাইল সুপারিশ করতে পারে।</p>
      <p><strong>কীভাবে প্রোফাইল যাচাই করাব?</strong></p>
      <p>সহায়তা সেবায় গিয়ে 'যাচাই করুন' বেছে নিন। আমাদের টিম পরিচয় যাচাইয়ের প্রক্রিয়ায় আপনাকে সাহায্য করবে। যাচাইকৃত প্রোফাইলে যাচাইয়ের চিহ্ন দেখা যায়, যা সম্ভাব্য জীবনসঙ্গীদের আস্থা বাড়ায়।</p>

- model: Faq
