  fields:
    title_bn: প্রোফাইল ব্যবস্থাপনা
    content_bn: |
      <p><strong>BoloKobul.com-এ কীভাবে নতুন প্রোফাইল তৈরি করব?</strong></p>
      <p>প্রোফাইল তৈরি সহজ এবং সম্পূর্ণ বিনামূল্যে। হোমপেজের বিনামূল্যের <a href="https://www.bolokobul.com/" target="_blank">নিবন্ধন ফর্ম</a> পূরণ করলেই হবে।</p>
      <p><strong>কীভাবে প্রোফাইল সম্পাদনা করব?</strong></p>
      <p><a href="https://www.bolokobul.com/marriage_profiles/Bk0000142/profile_info" target="_blank">প্রোফাইল সম্পাদনা</a>-এ চাপুন। লগইন করার পর প্রোফাইল সম্পাদনায় চেপে অথবা লোগোর নিচের মেনুতে প্রোফাইলে চেপেও এই পাতায় যেতে পারেন।</p>
      <p><strong>প্রোফাইলে আমার প্রদর্শিত নাম কীভাবে বদলাব?</strong></p>
      <p>প্রদর্শিত নাম, অর্থাৎ আপনার প্রোফাইল আইডি বদলানো যায় না। আপনার নাম সুরক্ষিত রাখতে এবং গোপনীয়তা ও নিরাপত্তা নিশ্চিত করতে এই অনন্য পরিচয় নম্বরটিই BoloKobul.com-এ আপনার পরিচয়।</p>
      <p><strong>প্রোফাইল সম্পাদনা পাতা থেকে কি সব তথ্য বদলাতে পারি?</strong></p>
      <p>প্রোফাইলের বেশিরভাগ তথ্য বদলাতে পারবেন। তবে কিছু তথ্য (যেমন জন্মতারিখ, লিঙ্গ, বৈবাহিক অবস্থা, নিজ জেলা, রক্তের গ্রুপ ইত্যাদি) শুধু বিশেষ পরিস্থিতিতে বদলানো যায়। এগুলো বদলাতে উপযুক্ত কারণসহ গ্রাহক সহায়তায় লিখুন: <u>support@bolokobul.com</u>।</p>
      <p><strong>নিবন্ধন ও প্রোফাইল তৈরির পর কি ইমেইল বদলাতে পারি?</strong></p>
      <p>না, ইমেইল ঠিকানা নিজে সম্পাদনা করা যায় না। বদলাতে চাইলে গ্রাহক সহায়তায় লিখুন: <u>support@bolokobul.com</u>।</p>
