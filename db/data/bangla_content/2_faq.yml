    content_bn: |
      <p><strong>চ্যাট তালিকায় কাদের অনলাইনে দেখতে পাব?</strong></p>
      <p>গৃহীত সদস্যদের — যারা আপনার কাছ থেকে বাটারফ্লাই পাওয়ার পর আপনাকে বাটারফ্লাই পাঠিয়েছেন, অথবা নিজে পাঠানোর পর আপনার কাছ থেকে একটি পেয়েছেন।</p>
      <p>অর্থাৎ যারা আপনার সঙ্গে চ্যাট করতে রাজি হয়েছেন।</p>
      <p><strong>কারও সঙ্গে চ্যাট করছি কিন্তু আর চালিয়ে যেতে চাই না, কী করব?</strong></p>
      <p>চ্যাটে জানিয়ে দিতে পারেন যে আপনি আর এগোতে চান না, এবং চ্যাট মুছে ফেলতে বা তাকে ব্লক করতে পারেন।</p>
      <p><strong>আমি একজনকে বাটারফ্লাই পাঠালাম, তিনিও আমাকে পাঠালেন। কিন্তু পুরো প্রোফাইল দেখার পর আর চ্যাট করতে চাই না, কী করব?</strong></p>
      <p>চ্যাট শুরু না করেই তাকে উপেক্ষা বা ব্লক করতে পারেন।</p>
      <p><strong>পুরো প্রোফাইল দেখার পর উপেক্ষা বা ব্লক করলে কি আমার বাটারফ্লাইয়ে প্রভাব পড়বে?</strong></p>
      <p>হ্যাঁ। বাটারফ্লাই পাঠানো ও পাওয়া — দুটোই হয়ে গেলে এবং বিস্তারিত প্রোফাইল দেখা হলে বাটারফ্লাইটির কাজ শেষ বলে ধরা হয়, তাই সেটি উড়ে যায়। ফলে সেই বাটারফ্লাই আর ব্যবহার করা যাবে না।</p>

- model: Faq
  id: 22
  fields:
    title_bn: রিপোর্ট ও ব্লক
    content_bn: |
      <p><strong>রিপোর্ট ও ব্লক কী? কখন এটি ব্যবহার করব?</strong></p>
      <p>প্রতিটি প্রোফাইলে "রিপোর্ট ও ব্লক" অপশন আছে। কেউ আপনাকে অস্বস্তিতে ফেললে বা নিয়ম ভাঙলে এটি ব্যবহার করুন — যেমন ভুয়া প্রোফাইল বা মিথ্যা তথ্য, অনুপযুক্ত ছবি বা বিষয়বস্তু, হয়রানি বা আপত্তিকর বার্তা, টাকা চাওয়া বা প্রতারণা, অথবা ইতিমধ্যে বিবাহিত বা বিয়ের ব্যাপারে আন্তরিক নন।</p>
      <p><strong>কীভাবে কাউকে রিপোর্ট বা ব্লক করব?</strong></p>
      <ol>
        <li>প্রোফাইল বা প্রোফাইল কার্ডের তিন-বিন্দু মেনুতে (⋮) চেপে "রিপোর্ট ও ব্লক" বেছে নিন।</li>
        <li>একটি কারণ বেছে নিন। "অন্য কিছু" বেছে নিলে কয়েকটি কথা লিখে দিন।</li>
        <li>"এই প্রোফাইলটি ব্লকও করুন" আগে থেকেই টিক দেওয়া থাকে। শুধু রিপোর্ট করতে চাইলে টিকটি তুলে দিন।</li>
        <li>"রিপোর্ট ও ব্লক" (অথবা "রিপোর্ট পাঠান") চাপুন।</li>
      </ol>
      <p>রিপোর্ট না করে শুধু ব্লক করতে চাইলে একই জায়গায় নিচের "শুধু ব্লক করুন, রিপোর্ট নয়" চাপুন।</p>
      <p><strong>কাউকে ব্লক করলে কী হয়?</strong></p>
      <p>আপনারা কেউ কাউকে আর দেখতে পাবেন না। তিনি আপনার প্রোফাইল দেখতে, আপনাকে কবুল বা বার্তা পাঠাতে পারবেন না, এবং আপনাদের মধ্যে কোনো চ্যাট থাকলে তা বন্ধ হয়ে যাবে। আপনি তাকে ব্লক করেছেন, এটি তাকে জানানো হয় না।</p>
      <p><strong>আমার রিপোর্ট কি গোপন থাকবে?</strong></p>
      <p>হ্যাঁ। কে রিপোর্ট করেছেন, সেই সদস্য কখনো জানতে পারবেন না। বলো কবুলের নিরাপত্তা টিম ২৪ ঘণ্টার মধ্যে প্রতিটি রিপোর্ট দেখে এবং প্রয়োজনে ব্যবস্থা নেয়, যার মধ্যে প্রোফাইল সরিয়ে দেওয়াও থাকতে পারে।</p>
      <p><strong>কীভাবে কাউকে আনব্লক করব?</strong></p>
      <p>লগইন করে <a href="https://www.bolokobul.com/marriage_profiles/blocked_profiles" target="_blank">গোপনীয়তা সেটিংস → ব্লক তালিকা</a>-তে যান এবং প্রোফাইলের পাশে "আনব্লক" চাপুন। শুধু যিনি ব্লক করেছেন, তিনিই আনব্লক করতে পারবেন।</p>

- model: Faq
  id: 23
  fields:
    title_bn: পেমেন্টের উপায়
    content_bn: |
      <p><strong>BoloKobul.com-এ কীভাবে পেমেন্ট করব?</strong></p>
      <p>আমাদের AamarPay পেমেন্ট গেটওয়ের মাধ্যমে বিকাশ, নগদ, ডেবিট/ক্রেডিট কার্ড (ভিসা/মাস্টারকার্ড) এবং অন্যান্য উপায়ে পেমেন্ট করতে পারেন। সব ফি টাকায় (BDT) হিসাব করা হয়।</p>
      <p><strong>পেমেন্টের জন্য কোন ধরনের ক্রেডিট কার্ড গ্রহণ করা হয়?</strong></p>
      <p>আমরা সব মাস্টার ও ভিসা ক্রেডিট কার্ড গ্রহণ করি।</p>
      <p><strong>BoloKobul.com-এ অনলাইন ডেবিট/ক্রেডিট কার্ড পেমেন্ট কি নিরাপদ?</strong></p>
      <p>হ্যাঁ, ১০০% নিরাপদ! আপনার ক্রেডিট কার্ডের তথ্য SSL প্রযুক্তি ও ১২৮ বিট এনক্রিপশন ব্যবহারকারী একটি নিরাপদ সার্ভারে দেওয়া হয়, যা ওয়েবসাইটগুলোর সর্বোচ্চ নিরাপত্তা স্তরগুলোর একটি। তথ্য এনক্রিপ্ট করা অবস্থায় আমাদের পেমেন্ট গেটওয়েতে পাঠানো হয় এবং অনলাইনে আপনার কার্ড থেকে টাকা কাটা হয়। সর্বোচ্চ নিরাপত্তার জন্য আমরা কখনোই আপনার ক্রেডিট কার্ডের তথ্য আমাদের অনলাইন সার্ভারে সংরক্ষণ করি না।</p>
      <p><strong>অর্ডার দেওয়ার পর একটি ইনভয়েস আইডি পেয়েছি। ইনভয়েস আইডি কী?</strong></p>
      <p>ইনভয়েস আইডি নির্দিষ্ট কোনো সেবার জন্য আপনার করা পেমেন্টকে আলাদাভাবে চিহ্নিত করে। ইনভয়েস আইডি পাওয়ার পর অবশ্যই এটি লিখে রাখুন এবং পরে কাজে লাগানোর জন্য সংরক্ষণ করুন। BoloKobul.com-এর গ্রাহক সহায়তার সঙ্গে যোগাযোগের সময় ইনভয়েস আইডি থাকলে আমরা দ্রুত আপনার তথ্য খুঁজে পাব।</p>
      <p><strong>পেমেন্ট করেছি, কিন্তু সেবা এখনো চালু হয়নি। কেন?</strong></p>
      <p>অনেক সময় পেমেন্টের খবর আমাদের কাছে পৌঁছাতে ১২ ঘণ্টা পর্যন্ত লাগে। পেমেন্ট পেলেই আমরা আপনাকে ইমেইলে জানাব।</p>
      <p><strong>টাকা ফেরতের নীতি কী?</strong></p>
      <p>BoloKobul.com অন্য সদস্যদের সঙ্গে চ্যাট বা যেকোনো সেবার জন্য টাকা নেওয়ার আগে সদস্যদের অনুমতি নেয়, তাই সাধারণত টাকা ফেরত দেওয়া হয় না। অব্যবহৃত বাটারফ্লাই বা সেবার জন্য টাকা ফেরত চাওয়া যাবে না।</p>

- model: Faq
  id: 24
  fields:
    title_bn: কারিগরি সমস্যা
    content_bn: |
      <p><strong>BoloKobul.com ব্যবহারের সময় একটি ত্রুটি দেখা দিচ্ছে। কী করব?</strong></p>
      <p>আমাদের সেবা ব্যবহারের সময় ত্রুটির মুখোমুখি হওয়ায় আমরা দুঃখিত। নিচের তথ্যসহ ত্রুটিটি আমাদের <a href="https://www.bolokobul.com/customer_supports/new" target="_blank">গ্রাহক সহায়তায়</a> জানানোর অনুরোধ রইল:</p>
      <ul>
        <li>যে লিংকে (URL) ত্রুটিটি দেখা দেয়</li>
        <li>ত্রুটির বার্তা</li>
        <li>ত্রুটি দেখা দেওয়ার তারিখ, সময় ও স্থান</li>
      </ul>
      <p><strong>ব্রাউজার কুকি কী? BoloKobul.com ব্যবহারে এগুলো কেন জরুরি?</strong></p>
      <p>BoloKobul.com বিভিন্ন সেবা দিতে এবং আপনার পছন্দ মনে রাখতে কুকি ব্যবহার করে। কুকি হলো একটি ছোট টেক্সট ফাইল, যা আপনার ব্রাউজারের মেমরিতে রাখা হয়। এটি ওয়েবসাইটকে পুরোনো ব্যবহারকারীদের চিনতে, সাইটটি নিয়মিত ব্যবহার সহজ করতে এবং বিষয়বস্তু উন্নত করা ও নির্দিষ্ট বিজ্ঞাপন দেখাতে সাহায্য করে।</p>
      <p>মনে রাখবেন, কুকি ব্যবহার BoloKobul.com প্রযুক্তির একটি প্রয়োজনীয় অংশ, এবং ওয়েবসাইটটি ব্যবহার করতে এগুলো দরকার। ব্রাউজারে কুকি বন্ধ রাখলে বা কম্পিউটার থেকে কুকি ফাইল মুছে ফেললে BoloKobul.com-এর কিছু সুবিধা ব্যবহার করতে ও সেবায় অংশ নিতে পারবেন না। নির্দিষ্টভাবে তথ্য দেখানোর মতো কিছু সুবিধা দিতেও কুকি প্রয়োজন হতে পারে।</p>
      <p>BoloKobul.com তার মূল বিয়ের সেবা দিতে, আপনার আগ্রহ অনুযায়ী বিষয়বস্তু দেখাতে এবং অন্যান্য কাজে কুকি ব্যবহার করে। কোনো ব্যবহারকারীর ব্যক্তিগত তথ্য সংগ্রহ করতে আমরা কুকি ব্যবহার করি না এবং করব না। মনে রাখবেন, কুকি শুধু BoloKobul.com থেকে আপনার কম্পিউটারে পাঠানো তথ্য মনে রাখতে ব্যবহৃত হয়। BoloKobul.com থেকে পাঠানো হয়নি এমন কোনো তথ্য আমরা আপনার কম্পিউটার থেকে দেখতে পারি না।</p>
      <p><strong>BoloKobul.com-এ নতুন কিছু দেখছি না কেন? গতকালের মতোই সব দেখছি।</strong></p>
      <p>এর কারণ আপনার ইন্টারনেট ব্রাউজার হতে পারে। আপনার ব্রাউজার সম্ভবত পুরোনো বিষয়বস্তু দেখাচ্ছে এবং নতুন করে লোড করছে না। একে বলে ক্যাশিং। পাতাটি ঠিকমতো রিফ্রেশ করতে ব্রাউজারের সেটিংসে গিয়ে ক্যাশ মুছে ফেলুন।</p>
