  fields:
    title_bn: 2.6 অন্যদের সঙ্গে যোগাযোগ
    content_bn: |
      <p>অন্য ব্যবহারকারীদের সঙ্গে আপনার যোগাযোগের জন্য শুধু আপনিই দায়ী। আপনি বুঝতে পারছেন যে বলো কবুল কোনোভাবেই ব্যবহারকারীদের কার্যকলাপ যাচাই করে না, ব্যবহারকারীদের পটভূমি খোঁজ করে না বা তাদের বক্তব্য যাচাইয়ের চেষ্টা করে না। ব্যবহারকারীদের আচরণ বা বর্তমান বা ভবিষ্যতের কোনো ব্যবহারকারীর সঙ্গে তাদের মানানসই হওয়া নিয়ে বলো কবুল কোনো প্রতিশ্রুতি বা নিশ্চয়তা দেয় না। বলো কবুল ওয়েবসাইট ব্যবহারের সঙ্গে সম্পর্কিত কারও আচরণ থেকে উদ্ভূত কোনো ক্ষতির জন্য — প্রত্যক্ষ, পরোক্ষ, সাধারণ, বিশেষ, ক্ষতিপূরণমূলক, পরিণামগত ও/অথবা আনুষঙ্গিক যা-ই হোক — কোনো অবস্থাতেই বলো কবুল দায়ী থাকবে না; এর মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়, এই ওয়েবসাইটের অন্য নিবন্ধিত ব্যবহারকারী বা এর মাধ্যমে পরিচিত ব্যক্তিদের সঙ্গে যোগাযোগ বা সাক্ষাতের ফলে শারীরিক আঘাত, মানসিক কষ্ট ও/অথবা অন্য যেকোনো ক্ষতি। সাইটের অন্য ব্যবহারকারীদের সঙ্গে সব যোগাযোগে, বিশেষ করে অফলাইনে বা সামনাসামনি দেখা করার সিদ্ধান্ত নিলে, আপনি যুক্তিসংগত সতর্কতা অবলম্বনে সম্মত হচ্ছেন। আপনি বুঝতে পারছেন যে ওয়েবসাইটের মাধ্যমে পরিচিত ব্যক্তিদের সঙ্গে আপনার চূড়ান্তভাবে মানানসই হওয়া নিয়ে বলো কবুল প্রকাশ্য বা অন্তর্নিহিত কোনো নিশ্চয়তা দেয় না। অন্য ব্যবহারকারীদের আপনার আর্থিক তথ্য (যেমন ক্রেডিট কার্ড বা ব্যাংক অ্যাকাউন্টের তথ্য) দেবেন না।</p>
      <h3 style="text-align: justify;"><strong><span style="font-size:16px;">2.6.1 তথ্য বিনিময়ের মাধ্যম</span></strong></h3>
      <p style="text-align: justify;">সেবা দেওয়ার পাশাপাশি বলো কবুল এমন একটি প্ল্যাটফর্ম, যেখানে সদস্যরা তাদের অভিন্ন বিয়ের লক্ষ্য পূরণে সহায়ক তথ্য বিনিময় করেন। স্পষ্টভাবে বুঝে নিতে হবে যে বলো কবুল শুধু তার সেবা কাঠামোর মধ্যে সদস্যদের মধ্যে যোগাযোগের সুযোগ দেবে, বলো কবুল প্রয়োজন মনে না করলে সদস্যদের সরাসরি যোগাযোগের তথ্য দেবে না। BoloKobul.com কোনো সদস্যের প্রতিনিধি নয় এবং তথ্য বিনিময় বা এর ফলাফলে অংশ নেয় না। সদস্যদের মধ্যে বিরোধ হলে বলো কবুল নিরপেক্ষ থাকবে, তবে বিরোধের সৌহার্দ্যপূর্ণ সমাধানে সহায়তা করতে পারে।</p>

