# Bangla text for the Terms of Use page, sections 1 to 3.
# The section numbers stay in English digits: the page uses them for its side menu.
- model: TermsOfUse
  id: 1
  fields:
    title_bn: 1.1 শর্তাবলি গ্রহণ
    content_bn: |
      <p>বলো কবুল বিশ্বাস করে, আমাদের ওয়েবসাইটের বিভিন্ন সেবা ও সুবিধা আপনি উপভোগ করবেন এবং তাতে অংশ নেবেন। আমাদের ওয়েবসাইটে নিবন্ধন করে আপনি নিচের শর্তাবলি মেনে চলতে সম্মত হচ্ছেন। আমরা যেকোনো সময় এই শর্তাবলি ও আমাদের গোপনীয়তা বিবৃতি পরিবর্তন করতে পারি। পরিবর্তন করলে শর্তাবলি ও গোপনীয়তা বিবৃতির সংশোধিত সংস্করণ ওয়েবসাইটে প্রকাশ করা হবে। নিয়মিত শর্তাবলি ও গোপনীয়তা বিবৃতি পড়ে দেখার দায়িত্ব আপনার। BoloKobul.com ব্যবহার অব্যাহত রাখার অর্থ আপনি যেকোনো নতুন বা পরিবর্তিত শর্ত মেনে নিচ্ছেন।</p>

- model: TermsOfUse
  id: 2
  fields:
    title_bn: 1.2 নিবন্ধন
    content_bn: |
      <p>নিবন্ধনের মাধ্যমে আপনি নিশ্চিত করছেন যে এখন বা ভবিষ্যতে আপনার দেওয়া সব তথ্য সঠিক, এবং আপনি শর্তাবলি ও আমাদের গোপনীয়তা বিবৃতি পড়েছেন ও তা মেনে চলতে সম্মত।</p>
      <p style="text-align: justify;">বলো কবুল নিজস্ব বিবেচনায়, কোনো নোটিশ ছাড়াই আপনাকে এই ওয়েবসাইট বা এর যেকোনো অংশ ব্যবহার থেকে বিরত রাখার অধিকার রাখে।</p>

- model: TermsOfUse
  id: 3
  fields:
    title_bn: 1.3 যোগ্যতা
    content_bn: |
      <p><b>অনুগ্রহ করে লক্ষ করুন: সদস্য হিসেবে নিবন্ধনের ন্যূনতম বয়স নারীদের জন্য ১৮ বছর এবং পুরুষদের জন্য ২১ বছর।</b></p>

- model: TermsOfUse
  id: 4
  fields:
    title_bn: 1.4 অনলাইন আচরণ
    content_bn: |
      <p>আপনি শুধু বৈধ উদ্দেশ্যে বলো কবুলের সেবা ব্যবহার করতে সম্মত হচ্ছেন। ওয়েবসাইটে, এর ফেসবুক পাতায় বা অন্য কোনো সামাজিক মাধ্যমের পাতায় যেকোনো ধরনের বেআইনি, ক্ষতিকর, হুমকিমূলক, অপমানজনক, হয়রানিমূলক, মানহানিকর, অশালীন, অশ্লীল, যৌন উত্তেজক, কুরুচিপূর্ণ, ঘৃণাপূর্ণ, জাতিগত বা বর্ণগতভাবে আপত্তিকর অথবা অন্যভাবে আপত্তিকর বিষয়বস্তু প্রকাশ বা প্রেরণ নিষিদ্ধ — যার মধ্যে রয়েছে, তবে এতেই সীমাবদ্ধ নয়, এমন বিষয়বস্তু যা ফৌজদারি অপরাধে উৎসাহ দেয়, দেওয়ানি দায় সৃষ্টি করে অথবা স্থানীয়, জাতীয় বা আন্তর্জাতিক কোনো প্রযোজ্য আইন লঙ্ঘন করে।</p>
      <p style="text-align: justify;">বলো কবুল যেকোনো ধরনের বিষয়বস্তু বা ইলেকট্রনিক যোগাযোগ প্রকাশ করতে পারে</p>
      <p style="text-align: justify; margin-left: 40px;">(i) কোনো আইন, বিধি বা সরকারি অনুরোধ পূরণে;</p>
      <p style="text-align: justify; margin-left: 40px;">(ii) BoloKobul.com ওয়েবসাইট পরিচালনার জন্য এমন প্রকাশ প্রয়োজনীয় বা যথাযথ হলে; অথবা</p>
      <p style="text-align: justify; margin-left: 40px;">(iii) বলো কবুল এবং এর কর্মকর্তা, পরিচালক, কর্মী, ঘটক, তৃতীয় পক্ষের বিষয়বস্তু সরবরাহকারী, ব্যবসায়ী, পৃষ্ঠপোষক ও লাইসেন্সদাতা এবং অন্য যেকোনো ব্যবহারকারীর অধিকার বা সম্পত্তি রক্ষায়।</p>
      <p style="text-align: justify;">ব্যবহারকারী, BoloKobul.com, এর সহযোগী প্রতিষ্ঠান, ফেসবুক বা অন্য সামাজিক মাধ্যমের পাতা, টিমের অংশ কমিউনিটিগুলো বা কোনো তৃতীয় পক্ষের জন্য ক্ষতিকর বলে বলো কবুল নিজস্ব বিবেচনায় মনে করে, অথবা কোনো প্রযোজ্য আইন লঙ্ঘন করে — এমন আচরণ, যোগাযোগ বা বিষয়বস্তু নিষিদ্ধ বা সীমিত করার অধিকার বলো কবুল রাখে। তা সত্ত্বেও অনলাইনে প্রকাশের পর প্রশ্নবিদ্ধ বিষয়বস্তু দ্রুত সরানোর নিশ্চয়তা বলো কবুল দিতে পারে না। সে কারণে বলো কবুলের ওয়েবসাইট ও/অথবা সামাজিক মাধ্যমের পাতায় কোনো তৃতীয় পক্ষের আচরণ, যোগাযোগ বা বিষয়বস্তুর ব্যাপারে কোনো পদক্ষেপ নেওয়া বা না নেওয়ার দায় বলো কবুল নেবে না।</p>

- model: TermsOfUse
  id: 5
  fields:
    title_bn: 2.1 সদস্যপদ
    content_bn: |
      <p style="text-align: justify;">(ক) আপনি বিনামূল্যে ঘটকালি সেবার সদস্য হতে পারেন। বিনামূল্যের সদস্যপদে শুধু ঘটকালি সেবার বিনামূল্যের সুবিধাগুলো ব্যবহার করা যাবে। সহায়তা সেবার মতো অতিরিক্ত সুবিধা পেতে সংশ্লিষ্ট সেবার ফি দিতে হবে। অর্থাৎ অতিরিক্ত সুবিধাগুলো পাওয়া নির্ভর করে সংশ্লিষ্ট ফি পরিশোধের ওপর। চাইলে শুধু নির্দিষ্ট কোনো সেবার জন্য পেমেন্ট করে আমাদের ওয়েবসাইটে সেই সেবা নিতে পারেন। পেমেন্টের মাধ্যমে আমাদের বিশেষজ্ঞদের পরামর্শ ও সেবাও নিতে পারেন।</p>
      <p style="text-align: justify;">(খ) সদস্যপদের আবেদনের মাধ্যমে আপনি নিশ্চয়তা দিচ্ছেন যে আপনি কোনো বিচারযোগ্য অপরাধ বা গুরুতর অপরাধে দণ্ডিত হননি, এবং কোনো সরকারি কর্তৃপক্ষের কাছে যৌন অপরাধী হিসেবে নিবন্ধিত হতে হয়নি।</p>
      <p style="text-align: justify;">(গ) আপনি স্বীকার করছেন যে বর্তমানে প্রতিষ্ঠানটি নিয়মিতভাবে ব্যবহারকারীদের পটভূমি যাচাই, দেওয়া তথ্য যাচাই বা অপরাধমূলক রেকর্ড যাচাই করে না। আপনি কোনো নিশ্চয়তা ভঙ্গ করছেন না তা নিশ্চিত করতে এবং কোনো বক্তব্য মিথ্যা কি না তা নির্ধারণে সব সদস্যের বিষয়ে তদন্ত ও পটভূমি যাচাইয়ের অধিকার আমরা রাখি। আপনি এ ধরনের তদন্তে সম্মতি দিচ্ছেন, এবং কোনো নিশ্চয়তা ভঙ্গ করলে বা আপনার বক্তব্য মিথ্যা প্রমাণিত হলে আপনার সদস্যপদ প্রত্যাখ্যান ও/অথবা বাতিলের অধিকার আমরা রাখি।</p>

- model: TermsOfUse
  id: 6
  fields:
    title_bn: 2.2 প্রোফাইল তৈরি
    content_bn: |
      <p>আপনার প্রোফাইল, বার্তা, ভিডিও ও অডিও রেকর্ডিং এবং ওয়েবসাইটে আপলোড করা বা অন্য সদস্যদের পাঠানো অন্যান্য বিষয়বস্তুর জন্য শুধু আপনিই দায়ী।</p>
      <p style="text-align: justify;">আপনি সম্মত হচ্ছেন যে আপনার প্রোফাইলে বা ওয়েবসাইটে এমন কোনো বিষয়বস্তু আপলোড বা প্রকাশ করবেন না, যা:</p>
      <p style="text-align: justify; margin-left: 40px;">(i) আমাদের একক বিবেচনায় অপমানজনক, অশ্লীল, কুরুচিপূর্ণ, আপত্তিকর, যৌনতানির্ভর, হুমকিমূলক, হয়রানিমূলক, বর্ণগতভাবে আপত্তিকর, অনুচিত বা অন্যভাবে অনুপযুক্ত; অথবা</p>
      <p style="text-align: justify; margin-left: 40px;">(ii) আপনি ছাড়া অন্য কোনো ব্যক্তিকে চিত্রিত, বর্ণনা, শনাক্ত বা ইঙ্গিত করে।</p>
      <p style="text-align: justify;">প্রতিটি এনআইডি দিয়ে শুধু একটি ক্যান্ডিডেট প্রোফাইল তৈরি করা যাবে; অন্যের পক্ষ থেকে তাদের এনআইডি দিয়ে তৈরি করলে একাধিক করা যাবে। ক্যান্ডিডেট প্রোফাইলে সেই ব্যক্তির বর্ণনা থাকে, যার জন্য জীবনসঙ্গী খোঁজা হচ্ছে। প্রোফাইল তৈরিতে নিচের নিয়মগুলো প্রযোজ্য:</p>
      <h3 style="text-align: justify;"><span style="font-size:16px;"><strong>2.2.1 ক্যান্ডিডেটের সম্মতি</strong></span></h3>
      <p style="text-align: justify;">কারও পক্ষ থেকে প্রোফাইল তৈরি করলে প্রোফাইলে উপস্থাপিত ব্যক্তির ("ক্যান্ডিডেট") সম্মতি নিতে হবে। আপনি নিজে ক্যান্ডিডেট না হলে, প্রোফাইল তৈরির মাধ্যমে আপনি নিশ্চয়তা দিচ্ছেন যে ক্যান্ডিডেটের যথাযথ সম্মতি নেওয়া হয়েছে।</p>
      <h3 style="text-align: justify;"><span style="font-size:16px;"><strong>2.2.2 ছবি জমা দেওয়া</strong></span></h3>
      <p style="text-align: justify;">আপনার তৈরি প্রোফাইলের জন্য ক্যান্ডিডেটের অনুমোদন নিয়ে তার ছবি জমা দিতে পারেন, যদি না আপনি নিজেই ক্যান্ডিডেট হন। ছবিগুলো আসল হতে হবে।</p>
      <p style="text-align: justify;">ক্যান্ডিডেটের ছবি জমা দিয়ে আপনি নিশ্চয়তা দিচ্ছেন যে ক্যান্ডিডেটের যথাযথ সম্মতি নেওয়া হয়েছে। ছবিতে ক্যান্ডিডেটকে শনাক্ত করার মতো কোনো তথ্য থাকা যাবে না, যার মধ্যে রয়েছে (তবে এতেই সীমাবদ্ধ নয়) নাম, ইমেইল ঠিকানা, ফোন নম্বর বা ওয়েবসাইটের ঠিকানা। ছবিটি অশালীন, অশ্লীল, যৌন উত্তেজক, জাতিগত বা বর্ণগতভাবে আপত্তিকর অথবা অন্যভাবে আপত্তিকর হতে পারবে না।</p>
      <h3 style="text-align: justify;"><span style="font-size:16px;"><strong>2.2.3 তথ্যের নির্ভুলতা</strong></span></h3>
      <p style="text-align: justify;">আপনার দেওয়া তথ্য ও ছবি অবশ্যই সঠিক, সাম্প্রতিক ও সম্পূর্ণ হতে হবে। অন্য কোনো ব্যক্তি বা প্রতিষ্ঠানের পরিচয় ধারণ করা যাবে না। আমাদের ওয়েবসাইটে এমন কোনো ছবি পাঠানো বা প্রকাশ করা যাবে না, যাতে রয়েছে:</p>
      <p style="text-align: justify;">• আপনি বা ক্যান্ডিডেট ছাড়া অন্য কোনো ব্যক্তির ছবি;</p>
      <p style="text-align: justify;">• নগ্নতা;</p>
      <p style="text-align: justify;">• আপনাকে ছাড়া অন্য কোনো বস্তুর ছবি;</p>
      <p style="text-align: justify;">• কার্টুন বা অলংকরণ (আপনার হলেও)।</p>

- model: TermsOfUse
  id: 7
  fields:
    title_bn: 2.3 গোপনীয়তা
    content_bn: |
      <p>পৃথিবীর অন্য প্রান্তের উপযুক্ত জীবনসঙ্গী খুঁজতে ইন্টারনেট ব্যবহার করলেও আপনাকে গোপনীয়তা বিসর্জন দিতে হবে না। আমরা গোপনীয়তাকে অত্যন্ত গুরুত্ব দিই। আপনি গোপন রাখলে আপনার অনুমতি ছাড়া কেউ আপনার ছবি ডাউনলোড করতে বা আপনার নাম, যোগাযোগ নম্বর, ইমেইল ঠিকানা, পাসওয়ার্ড বা অন্য কোনো সংবেদনশীল তথ্য দেখতে পারবে না। আপনার তথ্য নিরাপদ ও গোপন জেনে নিশ্চিন্তে উপযুক্ত পাত্র বা পাত্রী খুঁজতে পারেন।</p>

